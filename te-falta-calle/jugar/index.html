<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Te falta calle!! — el juego de jerga venezolana. Juega gratis en tu navegador o en iPhone.">
  <meta name="theme-color" content="#16111C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #16111C; overscroll-behavior: none; overflow: hidden; }
    body { background: radial-gradient(1200px 700px at 50% 0%, #1b2a6b 0%, #070a18 60%) fixed, #070a18; }
    #game { position: fixed; inset: 0; }
    @media (min-width: 640px) and (min-height: 560px) {
      #game { inset: auto; left: 50%; top: 50%; transform: translate(-50%, -50%);
        height: min(94vh, 932px); width: min(calc(min(94vh, 932px) * 0.4625), 430px);
        border-radius: 34px; overflow: hidden; box-shadow: 0 0 0 10px #10131f, 0 0 0 12px #2b6cff55, 0 30px 90px rgba(29,123,255,.35); }
    }
    #vrf-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(circle at 50% 35%, #2a2140 0%, #16111C 70%); color: #FDF0DD; font-family: system-ui, sans-serif; z-index: 10; transition: opacity .4s; }
    #vrf-loader img { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 0 0 4px #FFD51A, 0 18px 50px rgba(255,213,26,.25); animation: vrf-b 1.4s ease-in-out infinite; }
    #vrf-loader .bar { width: 180px; height: 8px; border-radius: 8px; background: rgba(255,255,255,.12); overflow: hidden; }
    #vrf-loader .bar i { display: block; height: 100%; width: 40%; border-radius: 8px; background: linear-gradient(90deg, #FFD51A, #1D4FD8, #E8312B); animation: vrf-l 1.1s ease-in-out infinite; }
    #vrf-loader small { opacity: .6; letter-spacing: .12em; font-size: 11px; text-transform: uppercase; }
    @keyframes vrf-b { 50% { transform: translateY(-8px) scale(1.03); } }
    @keyframes vrf-l { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    #ios-tip { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 20; display: none; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: 16px; background: rgba(10,14,36,.94); color: #eef2ff; font: 14px/1.35 system-ui, sans-serif; box-shadow: 0 10px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(77,163,255,.35); }
    #ios-tip b { color: #ffd51a; }
    #ios-tip svg { flex: none; width: 26px; height: 26px; color: #4da3ff; }
    #ios-tip button { flex: none; margin-left: auto; background: none; border: 0; color: #9aa8cc; font-size: 22px; padding: 4px 6px; }
  </style>
  <script>
    // Publicador de AdSense: se activa cuando Google apruebe el sitio.
    window.VRF_ADSENSE_CLIENT = '';
  </script>
  <script src="vrf_ads.js"></script>
</head>
<body>
  <div id="game"></div>
  <div id="vrf-loader">
    <img src="icons/Icon-512.png" alt="Te falta calle!!">
    <div class="bar"><i></i></div>
    <small>Visual Rocket Flyer Games</small>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('vrf-loader');
      if (l) { l.style.opacity = '0'; setTimeout(function () { l.remove(); }, 450); }
    });
  </script>
  <div id="ios-tip" role="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
    <span>Para guardar tu progreso, toca <b>Compartir</b> y luego <b>Agregar a pantalla de inicio</b>.</span>
    <button aria-label="Cerrar">×</button>
  </div>
  <script>
    (function () {
      var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
      if (!ios || standalone) return;
      var key = 'vrf_ios_tip', today = new Date().toDateString();
      try { if (localStorage.getItem(key) === today) return; } catch (e) {}
      var tip = document.getElementById('ios-tip');
      function hide() { tip.style.display = 'none'; try { localStorage.setItem(key, today); } catch (e) {} }
      tip.querySelector('button').onclick = hide;
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(function () { tip.style.display = 'flex'; setTimeout(hide, 12000); }, 2500);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
