  ui.closePicker.addEventListener('click', () => { ui.picker.hidden = true; });
  const musicBtn = $('btn-music'), sfxBtn = $('btn-sfx');
  const audioLabels = () => {
    musicBtn.textContent = t(sound.state.music ? 'music_on' : 'music_off');
    sfxBtn.textContent = t(sound.state.sfx ? 'sfx_on' : 'sfx_off');
  };
  $('btn-lang').addEventListener('click', () => {
    lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
    try { localStorage.setItem('wobble-lang', lang); } catch {}
    applyLanguage();
  });
  musicBtn.addEventListener('click', () => { sound.setMusic(!sound.state.music); audioLabels(); });
  sfxBtn.addEventListener('click', () => { sound.setSfx(!sound.state.sfx); audioLabels(); });
  audioLabels();
  document.addEventListener('click', (ev) => { if (ev.target.closest('button')) sound.play('sfx_click', 0.7); });
  ui.menu.addEventListener('click', () => openPicker(worldNum(L.def.id)));
  ui.play.addEventListener('click', play);
  ui.reset.addEventListener('click', () => (L.state === 'prep' ? resetLevel() : retry()));
  ui.again.addEventListener('click', resetLevel);
  ui.resultBtn.addEventListener('click', async () => {
    if (L.state === 'fail') return retry();
    if (L.index < LEVELS.length - 1) {
      const next = L.index + 1;
      if (shouldInterstitial(L.index)) await showAd(false);
      loadLevel(next);
    } else { resetLevel(); showFinale(); }
  });
  $('btn-hint').addEventListener('click', () => {
    if (revealedHints.has(L.def.id)) { L.hint = true; return; }
    rewardedThen('hint_title', 'hint_body', () => { revealedHints.add(L.def.id); L.hint = true; });
  });
  $('btn-skip').addEventListener('click', () => {
    rewardedThen('skip_title', 'skip_body', () => {
      skipped[L.def.id] = 1;
      try { localStorage.setItem('wobble-skipped', JSON.stringify(skipped)); } catch {}
      loadLevel(L.index + 1);
    });
  });

  // ---- Dibujo ----
  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    view.half = Math.max(10, 4.9 / (canvas.width / canvas.height));
    view.scale = canvas.height / (2 * view.half);
  }
  new ResizeObserver(resize).observe(canvas);

  const c = ctx;
  const disc = (x, y, r, color) => { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = color; c.fill(); };

  // Sprites del mundo (los mismos PNG que usa Unity, generados con Tools/generate_art.py).
  const ART = {};
  for (const n of ['sky', 'cloud_a', 'cloud_b', 'cloud_c', 'island_a', 'island_b', 'hills', 'ground', 'block_stone', 'block_wood',
    'block_ice', 'boulder', 'spring_plate', 'spring_base', 'spring_coil', 'portal_arch', 'portal_swirl', 'star', 'arrow', 'dot',
    'fulcrum', 'fx_puff', 'fx_spark', 'fx_confetti', 'rotate_icon', 'workshop_wall', 'workshop_floor', 'block_plank', 'block_post',
    'crate', 'iron_ball', 'belt', 'toggle_icon', 'factory_wall', 'factory_floor', 'block_metal', 'gear',
    'sky_sunset', 'cloud_floor', 'cloud_pad', 'block_sky', 'balloon_red', 'balloon_yellow', 'balloon_teal', 'balloon_pink', 'fan_base', 'fan_blades', 'hot_air',
    'mine_wall', 'mine_floor', 'block_rock', 'magnet', 'mine_cart', 'crystal',
    'void_wall', 'void_floor', 'block_void', 'portal_blue', 'portal_orange', 'portal_green', 'portal_pink',
    'volcano_wall', 'volcano_floor', 'block_basalt', 'lava', 'confetti_bomb',
    'castle_wall', 'castle_floor', 'block_castle', 'storm_angry', 'storm_happy', 'wobbly_pip', 'wobbly_lumi', 'wobbly_zig', 'party_banner']) {
    const img = new Image();
    let tries = 0;
    img.onerror = () => { if (++tries < 3) setTimeout(() => { img.src = `art/${n}.png?r=${tries}`; }, 400 * tries); };
    img.src = `art/${n}.png`;
    ART[n] = img;
  }
  const ready = (img) => img.complete && img.naturalWidth > 0;

  /// Dibuja un sprite centrado en (x, y) con tamaño w×h en unidades del mundo (el lienzo tiene la y invertida).
  function sprite(img, x, y, w, h, angle = 0, alpha = 1) {
    if (!ready(img)) return;
    c.save(); c.translate(x, y); if (angle) c.rotate(angle); c.scale(1, -1);
    if (alpha !== 1) c.globalAlpha = alpha;
    c.drawImage(img, -w / 2, -h / 2, w, h);
    c.restore();
  }

  /// Bloque 9-slice: bordes de 24 px (0.125 u) que no se deforman al estirar.
  function sliced(img, x, y, w, h, angle = 0, tint = null) {
    if (!ready(img)) return;
    const n = img.naturalWidth, b = n / 4, bw = Math.min(0.125, w / 2), bh = Math.min(0.125, h / 2);
    c.save(); c.translate(x, y); if (angle) c.rotate(angle); c.scale(1, -1);
    const xs = [-w / 2, -w / 2 + bw, w / 2 - bw, w / 2], ys = [-h / 2, -h / 2 + bh, h / 2 - bh, h / 2];
    const sx = [0, b, n - b, n];
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      const dw = xs[i + 1] - xs[i], dh = ys[j + 1] - ys[j];
      if (dw <= 0 || dh <= 0) continue;
      c.drawImage(img, sx[i], sx[j], sx[i + 1] - sx[i], sx[j + 1] - sx[j], xs[i], ys[j], dw + 0.002, dh + 0.002);
    }
    if (tint) { c.globalCompositeOperation = 'source-atop'; c.fillStyle = tint; c.fillRect(-w / 2, -h / 2, w, h); }
    c.restore();
  }

  // ---- Partículas: polvo, destellos y confeti (solo visuales) ----
  const fx = (() => {
    const list = [];
    const CONFETTI = ['#ffd23f', '#ff7aa8', '#3dcab5', '#8088ff', '#ff8c42'];
    return {
      burst(kind, x, y, count, color) {
        if (sound.state.silent) return;   // los barridos de prueba no generan partículas
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const p = { kind, x, y, age: 0, rot: Math.random() * 6.28, spin: 0, color: color || '#ffffff' };
          if (kind === 'dust') Object.assign(p, { vx: Math.cos(a) * (0.6 + Math.random()), vy: Math.abs(Math.sin(a)) * (0.3 + Math.random()), g: 0.5, life: 0.35 + Math.random() * 0.25, s0: 0.25 + Math.random() * 0.15, s1: 0.6 });
          else if (kind === 'spark') Object.assign(p, { vx: Math.cos(a) * (1.5 + Math.random() * 2), vy: Math.sin(a) * (1.5 + Math.random() * 2), g: 1, life: 0.35 + Math.random() * 0.25, s0: 0.3, s1: 0.03, spin: (Math.random() - 0.5) * 12 });
          else Object.assign(p, { vx: (Math.random() - 0.5) * 6, vy: 4 + Math.random() * 4, g: 7, life: 1.4 + Math.random() * 0.8, s0: 0.22, s1: 0.22, spin: (Math.random() - 0.5) * 18, color: CONFETTI[i % CONFETTI.length] });
          list.push(p);
        }
      },
      draw(dt) {
        for (let i = list.length - 1; i >= 0; i--) {
          const p = list[i];
          p.age += dt;
          if (p.age >= p.life) { list.splice(i, 1); continue; }
          const k = p.age / p.life;
          p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
          const s = p.s0 + (p.s1 - p.s0) * k;
          c.save(); c.globalAlpha = 1 - k * k;
          if (p.kind === 'confetti') { c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.color; c.fillRect(-s / 2, -s / 4, s, s / 2); }
          else if (p.kind === 'spark') { c.restore(); sprite(ART.fx_spark, p.x, p.y, s, s, p.rot, 1 - k * k); continue; }
          else { c.restore(); sprite(ART.fx_puff, p.x, p.y, s, s, 0, (1 - k * k) * 0.8); continue; }
          c.restore();
        }
      },
    };
  })();

  // Nubes que se desplazan e islas que flotan (fondo con profundidad).
  const CLOUDS = [['cloud_a', -3.5, 7.2, 0.7, 0.25], ['cloud_b', 2.8, 4.0, 0.55, 0.18], ['cloud_c', -1.0, -0.6, 0.5, 0.32], ['cloud_b', 4.5, 9.4, 0.45, 0.14]];
  const ISLANDS = [['island_a', -2.9, 5.6, 0.55, 0.15], ['island_b', -3.7, 0.2, 0.4, 0.12], ['island_a', 1.2, 8.4, 0.3, 0.1]];

  // Cielo: globos de fondo que suben en bucle y un globo aerostático que cruza despacio.
  const SKY_BALLOONS = [[-4.2, 0.0, 0.5, 'red'], [-2.6, 0.35, 0.35, 'teal'], [-0.4, 0.7, 0.42, 'yellow'], [1.8, 0.15, 0.32, 'pink'], [3.9, 0.55, 0.48, 'teal'], [2.9, 0.85, 0.3, 'red'], [-3.4, 0.6, 0.28, 'yellow']];

  const VOID_RINGS = [[-3.2, 5.5, 1.6, 0.3], [3.4, -0.5, 1.2, -0.45], [-2.6, -4.8, 0.9, 0.6], [2.8, 8.2, 1.0, -0.25]];
  const MINE_CRYSTALS = [[-4.1, -6.9, 1.0, 0], [4.2, -5.4, 0.8, 1.7], [-3.6, 3.4, 0.7, 3.1], [3.7, 7.2, 0.9, 4.4], [0.4, 9.6, 0.6, 2.2]];

  function drawBackground(now) {
    const t = now / 1000;
    if (finaleOn) { drawFinale(now); return; }
    if (worldNum(L.def.id) === 8) {
      // Castillo: muro de piedra, antorchas que parpadean y nubarrones que pasan por detrás.
      sprite(ART.castle_wall, 0, CAMERA_Y + 0.5, 11 * 1.2, 22 * 1.2);
      c.save(); c.globalAlpha = 0.12 + 0.05 * Math.sin(t * 9); c.fillStyle = '#ffb050'; c.fillRect(-8, CAMERA_Y - 14, 16, 28); c.restore();
      for (const [x0, y, s, speed] of [[-4, 7.5, 0.7, 0.3], [3, 3.5, 0.5, -0.22], [0, -1.5, 0.45, 0.18]]) {
        let x = x0 + t * speed; x = ((x + 9) % 18 + 18) % 18 - 9;
        sprite(ART.storm_angry, x, y, 3.2 * s, 2.4 * s, 0, 0.3);
      }
      return;
    }
    if (worldNum(L.def.id) === 7) {
      // Volcán: cielo rojizo, confeti que llueve de los cráteres y brasas que suben.
      sprite(ART.volcano_wall, 0, CAMERA_Y + 0.5, 11 * 1.2, 22 * 1.2);
      c.save(); c.globalAlpha = 0.15; c.fillStyle = '#200810'; c.fillRect(-8, CAMERA_Y - 14, 16, 28); c.restore();
      const COLS = ['#ffd23f', '#ff7aa8', '#3dcab5', '#8088ff', '#ff8c42'];
      for (let i = 0; i < 18; i++) {
        const k = ((t * 0.12 + i / 18) % 1);
        const x = -4.6 + ((i * 1.93) % 9.2) + Math.sin(t * 1.5 + i) * 0.3, y = 11 - k * 22;
        c.save(); c.translate(x, y); c.rotate(t * 3 + i); c.globalAlpha = 0.7; c.fillStyle = COLS[i % 5]; c.fillRect(-0.09, -0.045, 0.18, 0.09); c.restore();
      }
      for (let i = 0; i < 8; i++) {
        const k = ((t * 0.2 + i / 8) % 1);
        sprite(ART.fx_spark, -4 + ((i * 1.31) % 8), -8.5 + k * 9, 0.18, 0.18, t * 4 + i, 0.6 * (1 - k));
      }
      return;
    }
    if (worldNum(L.def.id) === 6) {
      // Portal: espacio con nebulosas, anillos que giran despacio y estrellas que titilan.
      sprite(ART.void_wall, 0, CAMERA_Y + 0.5, 11 * 1.2, 22 * 1.2);
      for (const [x, y, s, sp] of VOID_RINGS) {
        c.save(); c.translate(x, y); c.rotate(t * sp); c.scale(1, 0.45);
        c.strokeStyle = 'rgba(160,140,255,0.35)'; c.lineWidth = 0.08;
        c.beginPath(); c.arc(0, 0, s, 0, Math.PI * 1.6); c.stroke(); c.restore();
      }
      for (let i = 0; i < 12; i++) {
        const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.3 + i * 2.1));
        sprite(ART.fx_spark, -4.5 + ((i * 2.37) % 9), -9 + ((i * 3.71) % 20), 0.25, 0.25, t + i, tw * 0.8);
      }
      return;
    }
    if (worldNum(L.def.id) === 5) {
      // Mina: cueva con vetas, cristales que laten, faroles que oscilan y polvo que cae.
      sprite(ART.mine_wall, 0, CAMERA_Y + 0.5, 11 * 1.2, 22 * 1.2);
      c.save(); c.globalAlpha = 0.22; c.fillStyle = '#0c0814'; c.fillRect(-8, CAMERA_Y - 14, 16, 28); c.restore();
      for (const [x, y, s, ph] of MINE_CRYSTALS) {
        const glowA = 0.35 + 0.25 * Math.sin(t * 1.6 + ph);
        const grad = c.createRadialGradient(x, y + s * 0.2, 0, x, y + s * 0.2, s * 1.1);
        grad.addColorStop(0, 'rgba(143,227,255,0.7)'); grad.addColorStop(1, 'rgba(143,227,255,0)');
        c.save(); c.globalAlpha = glowA; c.fillStyle = grad; c.beginPath(); c.arc(x, y + s * 0.2, s * 1.1, 0, Math.PI * 2); c.fill(); c.restore();
        sprite(ART.crystal, x, y, s, s, 0, 0.9);
      }
      for (let i = 0; i < 8; i++) {
        const k = ((t * 0.12 + i / 8) % 1);
        sprite(ART.fx_puff, -4 + ((i * 1.37) % 8), 10 - k * 20, 0.12, 0.12, 0, 0.4 * Math.sin(k * Math.PI));
      }
      return;
    }
    if (worldNum(L.def.id) === 4) {
      sprite(ART.sky_sunset, 0, CAMERA_Y + 0.5, 11 * 1.2, 22 * 1.2);
      { const x = -7 + ((t * 0.18) % 14); sprite(ART.hot_air, x, 6.5 + Math.sin(t * 0.6) * 0.3, 2.1, 2.94, Math.sin(t * 0.5) * 0.04, 0.9); }
      for (const [x0, ph, s, col] of SKY_BALLOONS) {
        const k = ((t * 0.035 * (1.4 - s) + ph) % 1);
        sprite(ART['balloon_' + col], x0 + Math.sin(t * 0.8 + ph * 9) * 0.3, -12 + k * 26, 1.6 * s, 2.4 * s, Math.sin(t + ph * 5) * 0.08, 0.55);
      }
      for (const [n, x0, y, s, speed] of CLOUDS) {
        let x = x0 + t * speed * 1.4;
        x = ((x + 9) % 18 + 18) % 18 - 9;
        sprite(ART[n], x, y - 1.5, 5.12 * s, 2.56 * s, 0, 0.6);
      }
      return;
    }
    if (worldNum(L.def.id) === 3) {
      // Fábrica: paneles morados, engranajes que giran y nubes de vapor que suben.
      sprite(ART.factory_wall, 0, CAMERA_Y + 0.5, 11 * 1.2, 22 * 1.2);
      c.save(); c.globalAlpha = 0.18; c.fillStyle = '#140c2a'; c.fillRect(-8, CAMERA_Y - 14, 16, 28); c.restore();
      for (const [x, y, s, dir] of [[-3.6, 6.0, 2.6, 1], [-1.9, 4.6, 1.5, -1.7], [3.7, -1.0, 2.2, -1], [2.4, -2.4, 1.2, 1.8]])
        sprite(ART.gear, x, y, s, s, t * 0.5 * dir, 0.85);
      for (let i = 0; i < 6; i++) {
        const k = ((t * 0.25 + i / 6) % 1);
        sprite(ART.fx_puff, (i % 2 ? 3.4 : -3.2) + Math.sin(t + i) * 0.3, -6 + k * 9, 0.6 + k * 1.4, 0.6 + k * 1.4, 0, 0.35 * (1 - k));
      }
      return;
    }
    if (worldNum(L.def.id) === 2) {
      // Taller: pared de tablones y motas de serrín flotando en la luz.
      sprite(ART.workshop_wall, 0, CAMERA_Y + 0.5, 11 * 1.2, 22 * 1.2);
      c.save(); c.globalAlpha = 0.28; c.fillStyle = '#2a1608'; c.fillRect(-8, CAMERA_Y - 14, 16, 28); c.restore();   // atenúa el fondo: lo jugable destaca
      for (let i = 0; i < 7; i++) {
        let x = -3.5 + i * 1.15 + t * (0.08 + (i % 3) * 0.04);
        x = ((x + 9) % 18 + 18) % 18 - 9;
        sprite(ART.fx_puff, x, -2 + (i % 3) * 2.6 + Math.sin(t + i) * 0.25, 0.18 + (i % 2) * 0.1, 0.18 + (i % 2) * 0.1, 0, 0.35);
      }
      return;
    }
    const top = CAMERA_Y + view.half, h = view.half * 2;
    const halfW = view.half * canvas.width / canvas.height;
    sprite(ART.sky, 0, CAMERA_Y, halfW * 2 + 1, h + 1);
    for (const [n, x, y, s, bob] of ISLANDS) sprite(ART[n], x, y + Math.sin(t + x * 1.3 + y) * bob, 5.12 * s, 4.2 * s, 0, 0.8);
    for (const [n, x0, y, s, speed] of CLOUDS) {
      let x = x0 + t * speed;
      x = ((x + 9) % 18 + 18) % 18 - 9;
      sprite(ART[n], x, y, 5.12 * s, 2.56 * s, 0, 0.92);
    }
    sprite(ART.hills, 0, FLOOR_TOP + 1.3, 10.24 * 1.45, 3 * 1.45);
    void top;
  }

  function dragArrows(x, y, spread, now) {
    const sway = Math.sin(now / 200) * 0.07;
    sprite(ART.arrow, x - spread - sway, y, 0.38, 0.38, Math.PI / 2);
    sprite(ART.arrow, x + spread + sway, y, 0.38, 0.38, -Math.PI / 2);
  }

  let lastDraw = 0;
  function draw(now) {
    const dt = Math.min(0.05, (now - (lastDraw || now)) / 1000);
    lastDraw = now;
    c.fillStyle = '#46a1e8';
    c.fillRect(0, 0, canvas.width, canvas.height);
    c.save();
    c.translate(canvas.width / 2, canvas.height / 2);
    c.scale(view.scale, -view.scale);
    c.translate(0, -CAMERA_Y);
    if (performance.now() < shakeUntil) c.translate(Math.sin(now / 15) * 0.08, Math.cos(now / 19) * 0.08);   // temblor de la explosión

    drawBackground(now);
    if (finaleOn) { fx.draw(dt); c.restore(); return; }   // la fiesta ocupa toda la escena
    const wn = worldNum(L.def.id);
    const floorArt = [ART.ground, ART.workshop_floor, ART.factory_floor, ART.cloud_floor, ART.mine_floor, ART.void_floor, ART.volcano_floor, ART.castle_floor][wn - 1] || ART.ground;
    const wallArt = [ART.block_stone, ART.block_post, ART.block_metal, ART.block_sky, ART.block_rock, ART.block_void, ART.block_basalt, ART.block_castle][wn - 1] || ART.block_stone;
    sprite(floorArt, 0, FLOOR_TOP - 3, 14, 6);
    sliced(wallArt, -5.3, 0, 0.6, 30);
    sliced(wallArt, 5.3, 0, 0.6, 30);

    // rieles punteados de las piezas arrastrables
    if (L.state === 'prep') {
      for (const d of L.draggables) {
        if (!d.drag) continue;
        const y = d.type === 'spring' ? FLOOR_TOP + 0.05 : d.body.getPosition().y;
        const pad = d.type === 'spring' ? 0.6 : d.type === 'block' ? d.def.w / 2 * Math.abs(Math.cos(d.body.getAngle())) : d.r;
        for (let x = d.drag.xMin - pad; x <= d.drag.xMax + pad + 0.001; x += 0.35) sprite(ART.dot, x, y, 0.09, 0.09, 0, 0.75);
      }
    }

    // los imanes van delante: no deben quedar tapados por la meta
    for (const piece of L.pieces) if (piece.type !== 'magnet') drawPiece(piece, now);
    for (const piece of L.magnets) drawPiece(piece, now);

    // Piezas giratorias: aro con flechas que se mece, y brillo amarillo como las arrastrables.
    if (L.state === 'prep') {
      for (const d of L.draggables) {
        if (!d.rotate || dragging === d) continue;
        const p = d.type === 'spring' ? d.body.getWorldPoint(Vec2(0, 0.5)) : d.body.getPosition();
        const rock = Math.sin(now / 260) * 0.35;
        c.save(); c.translate(p.x, p.y); c.rotate(rock);
        c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = 0.08; c.lineCap = 'round';
        for (const side of [0, Math.PI]) {
          c.beginPath(); c.arc(0, 0, 0.75, side + 0.35, side + 1.3); c.stroke();
          const ex = Math.cos(side + 1.3) * 0.75, ey = Math.sin(side + 1.3) * 0.75;
          c.save(); c.translate(ex, ey); c.rotate(side + 1.3 + Math.PI / 2);
          c.fillStyle = 'rgba(255,255,255,0.95)'; c.beginPath(); c.moveTo(0.16, 0); c.lineTo(-0.08, 0.12); c.lineTo(-0.08, -0.12); c.closePath(); c.fill();
          c.restore();
        }
        c.restore();
      }
    }

    // Pista del Wobbly sabio: flecha y aro donde va cada pieza.
    if (L.hint && L.def.solution) {
      const pulse = 1 + 0.08 * Math.sin(now / 160);
      for (const s of L.def.solution) {
        const piece = L.pieces.find((p) => p.id === s.id);
        if (!piece) continue;
        const bp = piece.body.getPosition(), y = bp.y;
        if (s.dir !== undefined) {
          // Cinta: flecha con el sentido correcto. Ventilador: aro verde (encendido) o rojo (apagado).
          if (piece.type === 'fan' || piece.type === 'magnet' || piece.type === 'portal') { c.globalAlpha = 0.4; disc(bp.x, y + (piece.type === 'fan' ? 0.5 : 0), 1.1 * pulse, s.dir > 0 ? '#53d18a' : '#ff6b6b'); c.globalAlpha = 1; }
          else sprite(ART.arrow, bp.x, y + 0.95, 0.6 * pulse, 0.6 * pulse, s.dir > 0 ? -Math.PI / 2 : Math.PI / 2);
          continue;
        }
        if (s.angle !== undefined) {
          // Pieza giratoria: silueta amarilla con el ángulo correcto.
          c.save(); c.globalAlpha = 0.45 + 0.15 * Math.sin(now / 160);
          if (piece.type === 'spring') { c.translate(bp.x, bp.y); c.rotate(s.angle * DEG); c.fillStyle = '#ffd23f'; c.fillRect(-0.65, 0, 1.3, 1.05); }
          else if (piece.type === 'portal' || piece.type === 'fan') { c.translate(bp.x, bp.y); c.rotate(s.angle * DEG); c.restore(); sprite(ART.arrow, bp.x - Math.sin(s.angle * DEG) * 1.6, bp.y + Math.cos(s.angle * DEG) * 1.6, 0.6 * pulse, 0.6 * pulse, s.angle * DEG); continue; }
          else sliced(ART.block_wood, bp.x, bp.y, piece.def.w, piece.def.h, s.angle * DEG, '#ffd23f');
          c.restore();
          continue;
        }
        c.globalAlpha = 0.35; disc(s.x, y + 0.4, 0.75 * pulse, '#ffd23f'); c.globalAlpha = 1;
        sprite(ART.arrow, s.x, y + 1.9, 0.6 * pulse, 0.6 * pulse, Math.PI);
      }
    }

    const b = L.bloop, p = b.getPosition(), v = b.getLinearVelocity();
    let pose = 'idle', stretch = 1;
    if (finishedPose) pose = finishedPose;
    else {
      if (performance.now() < launchUntil) pose = 'anticipation';
      else if (Math.abs(v.y) > 3) pose = 'airborne';
      stretch = Math.min(1.2, 1 + Math.abs(v.y) * 0.015);
      if (v.x * v.x + v.y * v.y < 0.25) stretch *= 1 + Math.sin(now / 312) * 0.035;   // respira en reposo
    }
    const img = poses[pose], size = 512 / 340;
    if (img.complete && img.naturalWidth) {
      c.save(); c.translate(p.x, p.y + 0.05); c.scale(1 / stretch, -stretch);
      c.drawImage(img, -size / 2, -size / 2, size, size); c.restore();
    } else disc(p.x, p.y, 0.5, '#36a6f0');

    fx.draw(dt);
    c.restore();
    const counter = $('star-count');
    if (counter) counter.textContent = `${collectedStars()}/${L.stars.length}`;
  }

  /// Icono de interruptor de los portales que se abren o cierran tocándolos.
  function drawPortalIcon(piece, pos, now) {
    if (!piece.toggle || L.state !== 'prep') return;
    const bounce = performance.now() - (piece.flash || 0) < 200 ? 1.25 : 1;
    const ix = pos.x + 0.95, iy = pos.y + 0.5;
    disc(ix, iy, 0.3 * bounce, '#26345c');
    disc(ix, iy, 0.24 * bounce, piece.on ? '#53d18a' : '#ff6b6b');
    c.save(); c.strokeStyle = '#fff'; c.lineWidth = 0.05; c.lineCap = 'round';
    c.beginPath(); c.arc(ix, iy, 0.12 * bounce, Math.PI / 2 + 0.6, Math.PI / 2 - 0.6 + Math.PI * 2); c.stroke();
    c.beginPath(); c.moveTo(ix, iy + 0.16 * bounce); c.lineTo(ix, iy + 0.02); c.stroke(); c.restore();
  }

  // ---- Gran Fiesta: escena final con todos los Wobblies y el Gruñubarrón contento ----
  let finaleOn = false, finaleStart = 0, nextBurst = 0;
  function showFinale() {
    finaleOn = true; finaleStart = performance.now(); nextBurst = 0;
    sound.setWorld('fiesta');
    $('finale-title').textContent = t('finale_title');
    $('finale-body').textContent = t('finale_body');
    $('finale-again').textContent = t('finale_again');
    $('finale').hidden = false;
    ui.play.hidden = true; $('btn-hint').hidden = true; ui.hint.parentElement.hidden = true;
  }
  $('finale-again').addEventListener('click', () => {
    finaleOn = false; $('finale').hidden = true;
    sound.setWorld(worldNum(L.def.id)); setState(L.state); openPicker(1);
  });
  function drawFinale(now) {
    const t = (now - finaleStart) / 1000;
    sprite(ART.castle_wall, 0, CAMERA_Y + 0.5, 11 * 1.2, 22 * 1.2);
    c.save(); c.globalAlpha = 0.25; c.fillStyle = '#ffd890'; c.fillRect(-8, CAMERA_Y - 14, 16, 28); c.restore();
    sprite(ART.party_banner, 0, 7.0 + Math.sin(t) * 0.1, 10.5, 1.64);
    sprite(ART.party_banner, 0, 4.9 + Math.sin(t + 1) * 0.1, 10.5, 1.64);
    sprite(ART.storm_happy, 0, 2.2 + Math.sin(t * 1.5) * 0.25, 4.0, 3.0, Math.sin(t * 2) * 0.06);
    const dancers = [['wobbly_pip', -3.3], ['bloop', -1.1], ['wobbly_lumi', 1.1], ['wobbly_zig', 3.3]];
    dancers.forEach(([n, x], i) => {
      const hop = Math.abs(Math.sin(t * 3 + i * 0.8)) * 0.9;
      const squash = 1 + Math.sin(t * 6 + i) * 0.06;
      if (n === 'bloop') {
        const img = poses.victory, size = 2.4;
        if (img.complete && img.naturalWidth) { c.save(); c.translate(x, -1.6 + hop); c.scale(1 / squash, -squash); c.drawImage(img, -size / 2, -size / 2, size, size); c.restore(); }
      } else sprite(ART[n], x, -1.75 + hop, 2.4 / squash, 2.4 * squash, Math.sin(t * 3 + i) * 0.1);
    });
    if (t > nextBurst) { nextBurst = t + 0.7; fx.burst('confetti', -4 + Math.random() * 8, 8, 30); }
  }

  function drawPiece(piece, now) {
    const d = piece.def, body = piece.body;
    const pos = body ? body.getPosition() : null;
    const isDrag = !!piece.drag && L.state === 'prep';
    const look = { ice: ART.block_ice, wood: ART.block_wood, plank: ART.block_plank, metal: ART.block_metal, sky: ART.block_sky, rock: ART.block_rock, void: ART.block_void, basalt: ART.block_basalt, castle: ART.block_castle }[d.look] || ART.block_stone;
    if (piece.type === 'block') {
      if (piece.drag || piece.rotate) sliced(look, pos.x, pos.y, d.w + 0.22, d.h + 0.22, body.getAngle(), dragging === piece ? '#fff3b0' : '#ffd040');
      sliced(look, pos.x, pos.y, d.w, d.h, body.getAngle());
      if (isDrag && dragging !== piece) dragArrows(pos.x, pos.y, d.w / 2 * Math.abs(Math.cos(body.getAngle())) + 0.35, now);
    } else if (piece.type === 'seesaw') {
      const fh = d.y - FLOOR_TOP;
      sprite(ART.fulcrum, d.x, FLOOR_TOP + fh / 2, 0.9, fh);
      c.save(); c.translate(pos.x, pos.y); c.rotate(body.getAngle());
      sliced(ART.block_wood, 0, 0, d.w, 0.3);
      sliced(ART.block_wood, piece.lipX, 0.35, 0.2, 0.5);
      c.restore();
      disc(pos.x, pos.y, 0.13, '#3d4a73');
    } else if (piece.type === 'ball') {
      if (isDrag) disc(pos.x, pos.y, piece.r + 0.13, dragging === piece ? '#fff3b0' : '#ffd040');
      sprite(d.look === 'iron' ? ART.iron_ball : ART.boulder, pos.x, pos.y, piece.r * 2, piece.r * 2, body.getAngle());
      if (isDrag && dragging !== piece) dragArrows(pos.x, pos.y, piece.r + 0.35, now);
    } else if (piece.type === 'spring') {
      if (piece.squash > 0) piece.squash = Math.max(0, piece.squash - 1 / 60);
      const squash = 0.25 * Math.sin((piece.squash / 0.15) * Math.PI);
      c.save(); c.translate(pos.x, pos.y); c.rotate(body.getAngle());
      if (piece.drag || piece.rotate) {
        c.save(); c.globalAlpha = dragging === piece ? 0.75 : 0.5; c.fillStyle = '#ffd040';
        c.beginPath(); c.ellipse(0, 0.45, 0.95, 0.68, 0, 0, Math.PI * 2); c.fill(); c.restore();
      }
      sprite(ART.spring_coil, 0, 0.5 - squash / 2, 0.75, 0.5 - squash);
      sprite(ART.spring_base, 0, 0.14, 1.2, 0.28);
      sprite(ART.spring_plate, 0, 0.86 - squash, 1.3, 0.32);
      if (d.angle) sprite(ART.arrow, 0, 1.45, 0.45, 0.45, 0, 0.9);
      c.restore();
      if (isDrag && dragging !== piece) dragArrows(pos.x, pos.y + 0.45, 0.95, now);
    } else if (piece.type === 'goal') {
      const k = piece.r / 0.9, pulse = (1 + 0.035 * Math.sin(now / 300)) * k;
      sprite(ART.portal_arch, pos.x, pos.y + 0.2 * k, 1.95 * pulse, 2.44 * pulse);
      sprite(ART.portal_swirl, pos.x, pos.y, 1.25 * 0.95 * pulse, 1.25 * 0.95 * pulse, -now / 1000 * 2.1);
    } else if (piece.type === 'belt') {
      const w = d.w, dir = Math.sign(piece.speed) || 1;
      if (piece.toggle && L.state === 'prep') {
        c.save(); c.globalAlpha = 0.45 + 0.2 * Math.sin(now / 200); c.fillStyle = '#ffd040';
        c.fillRect(pos.x - w / 2 - 0.12, pos.y - 0.27, w + 0.24, 0.54); c.restore();
      }
      if (ready(ART.belt)) sliced(ART.belt, pos.x, pos.y, w, 0.3);
      else { c.fillStyle = '#2f3447'; c.fillRect(pos.x - w / 2, pos.y - 0.15, w, 0.3); }
      for (let x = pos.x - w / 2 + 0.15; x <= pos.x + w / 2 - 0.1; x += 0.5) disc(x, pos.y, 0.09, '#9aa3bd');
      // flechas que corren en el sentido de la cinta
      const phase = ((now / 1000) * Math.abs(piece.speed) * 0.5) % 0.6;
      c.save(); c.beginPath(); c.rect(pos.x - w / 2, pos.y - 0.2, w, 0.4); c.clip();
      c.fillStyle = 'rgba(255,214,64,0.95)';
      for (let k = -1; k < w / 0.6 + 1; k++) {
        const x = pos.x - w / 2 + (dir > 0 ? phase : 0.6 - phase) + k * 0.6;
        c.beginPath(); c.moveTo(x + dir * 0.12, pos.y + 0.03); c.lineTo(x - dir * 0.06, pos.y + 0.12); c.lineTo(x - dir * 0.06, pos.y - 0.06); c.closePath(); c.fill();
      }
      c.restore();
      if (piece.toggle && L.state === 'prep') {
        const bounce = performance.now() - (piece.flash || 0) < 200 ? 1.25 : 1;
        sprite(ART.toggle_icon || ART.rotate_icon, pos.x, pos.y + 0.75, 0.7 * bounce, 0.7 * bounce);
      }
    } else if (piece.type === 'storm') {
      const sp = L.state === 'prep' ? piece.from : piece.pos;
      if (L.state === 'prep' && (piece.to.x !== piece.from.x || piece.to.y !== piece.from.y)) {
        c.save(); c.globalAlpha = 0.35; c.strokeStyle = '#c8d0ff'; c.lineWidth = 0.06; c.setLineDash([0.2, 0.2]);
        c.beginPath(); c.moveTo(piece.from.x, piece.from.y); c.lineTo(piece.to.x, piece.to.y); c.stroke(); c.restore();
        sprite(ART.storm_angry, piece.to.x, piece.to.y, piece.r * 2.5, piece.r * 1.9, 0, 0.25);
      }
      const bob = Math.sin(now / 300) * 0.06;
      sprite(ART.storm_angry, sp.x, sp.y + bob, piece.r * 2.5, piece.r * 1.9, Math.sin(now / 500) * 0.05);
      if (Math.sin(now / 90 + sp.x) > 0.93) { c.save(); c.strokeStyle = '#ffe35a'; c.lineWidth = 0.07; c.beginPath(); c.moveTo(sp.x, sp.y - 0.6); c.lineTo(sp.x + 0.2, sp.y - 1.0); c.lineTo(sp.x - 0.1, sp.y - 1.1); c.lineTo(sp.x + 0.15, sp.y - 1.6); c.stroke(); c.restore(); }
    } else if (piece.type === 'bomb') {
      if (piece.exploded) return;
      const left = Math.max(0, piece.fuse - L.clock * DT);
      const urgent = L.state === 'sim' && piece.on && piece.fuse > 0 && left < 0.6;
      const wob = urgent ? Math.sin(now / 30) * 0.08 : Math.sin(now / 400) * 0.03;
      if ((piece.drag || piece.toggle) && L.state === 'prep') { c.save(); c.globalAlpha = dragging === piece ? 0.75 : 0.45 + (piece.toggle ? 0.15 * Math.sin(now / 200) : 0); disc(pos.x, pos.y, 0.75, '#ffd040'); c.restore(); }
      if (L.state === 'prep' && piece.on) { c.save(); c.globalAlpha = 0.18; c.strokeStyle = '#ffd23f'; c.lineWidth = 0.05; c.setLineDash([0.15, 0.15]); c.beginPath(); c.arc(pos.x, pos.y, piece.radius, 0, Math.PI * 2); c.stroke(); c.restore(); }
      const s = urgent ? 1.0 + Math.sin(now / 50) * 0.06 : 0.95;
      sprite(ART.confetti_bomb, pos.x, pos.y + 0.12, s, s, wob, piece.on ? 1 : 0.5);
      if (piece.on) sprite(ART.fx_spark, pos.x + 0.2, pos.y + 0.6, 0.3 + Math.random() * 0.12, 0.3, now / 80);
      // mecha restante (o «!» si estalla al tocarla)
      c.save(); c.scale(1, -1); c.font = 'bold 0.34px Fredoka, sans-serif'; c.textAlign = 'center'; c.fillStyle = '#fff'; c.strokeStyle = '#26345c'; c.lineWidth = 0.08;
      const label = piece.fuse > 0 ? left.toFixed(1) + 's' : '¡!';
      c.strokeText(label, pos.x, -pos.y + 0.05); c.fillText(label, pos.x, -pos.y + 0.05); c.restore();
      if (piece.toggle && L.state === 'prep') drawPortalIcon(piece, pos, now);
      if (isDrag && dragging !== piece) dragArrows(pos.x, pos.y, 0.8, now);
    } else if (piece.type === 'lava') {
      sliced(ART.lava, pos.x, pos.y, d.w, d.h, body.getAngle());
      for (let i = 0; i < Math.max(1, Math.floor(d.w)); i++) {
        const k = ((now / 1000 * 0.8 + i * 0.37) % 1);
        sprite(ART.fx_puff, pos.x - d.w / 2 + (i + 0.5) * d.w / Math.max(1, Math.floor(d.w)), pos.y + d.h / 2 + k * 0.5, 0.25, 0.25, 0, 0.5 * (1 - k));
      }
    } else if (piece.type === 'portal') {
      const ang = body.getAngle(), orange = piece.color === 'orange';
      const glowOn = (piece.drag || piece.rotate) && L.state === 'prep';
      if (glowOn) { c.save(); c.globalAlpha = dragging === piece ? 0.75 : 0.45; disc(pos.x, pos.y, 1.05, '#ffd040'); c.restore(); }
      c.save(); c.translate(pos.x, pos.y); c.rotate(ang);
      sprite(ART['portal_' + piece.color] || ART.portal_blue, 0, 0, 1.7, 1.06, 0, piece.on ? 1 : 0.35);
      if (!piece.on) { c.restore(); drawPortalIcon(piece, pos, now); return; }
      // remolino interior que gira
      c.save(); c.scale(1, 0.5); c.globalCompositeOperation = 'lighter';
      sprite(ART.portal_swirl, 0, 0, 0.95, 0.95, (orange ? 1 : -1) * now / 1000 * 3, 0.55);
      c.restore();
      // chispas que orbitan
      for (let i = 0; i < 4; i++) {
        const a2 = now / 1000 * 2 + i * Math.PI / 2;
        sprite(ART.fx_spark, Math.cos(a2) * 0.8, Math.sin(a2) * 0.42, 0.18, 0.18, a2, 0.8);
      }
      c.restore();
      drawPortalIcon(piece, pos, now);
      if (isDrag && dragging !== piece) dragArrows(pos.x, pos.y, 1.0, now);
    } else if (piece.type === 'magnet') {
      const ang = body.getAngle();
      const pole = body.getWorldPoint(Vec2(0, -0.55));
      if (piece.on) {
        // líneas de campo: anillos que se cierran hacia los polos
        c.save(); c.strokeStyle = '#7fd8ff'; c.lineWidth = 0.05;
        for (let i = 0; i < 3; i++) {
          const k = 1 - ((now / 1000 * 0.8 + i / 3) % 1);
          c.globalAlpha = 0.5 * (1 - k);
          c.beginPath(); c.arc(pole.x, pole.y, 0.3 + k * (piece.range - 0.3), 0, Math.PI * 2); c.stroke();
        }
        c.restore();
      }
      const glowOn = (piece.drag || piece.toggle) && L.state === 'prep';
      if (glowOn) { c.save(); c.globalAlpha = (dragging === piece ? 0.75 : 0.5) + (piece.toggle ? 0.15 * Math.sin(now / 200) : 0); disc(pos.x, pos.y, 0.85, '#ffd040'); c.restore(); }
      const buzz = piece.on ? Math.sin(now / 25) * 0.015 : 0;
      sprite(ART.magnet, pos.x + buzz, pos.y, 1.2, 1.2, ang, piece.on ? 1 : 0.75);
      if (piece.toggle && L.state === 'prep') {
        const bounce = performance.now() - (piece.flash || 0) < 200 ? 1.25 : 1;
        const ix = pos.x + 0.85, iy = pos.y + 0.55;
        disc(ix, iy, 0.3 * bounce, '#26345c');
        disc(ix, iy, 0.24 * bounce, piece.on ? '#53d18a' : '#ff6b6b');
        c.save(); c.strokeStyle = '#fff'; c.lineWidth = 0.05; c.lineCap = 'round';
        c.beginPath(); c.arc(ix, iy, 0.12 * bounce, Math.PI / 2 + 0.6, Math.PI / 2 - 0.6 + Math.PI * 2); c.stroke();
        c.beginPath(); c.moveTo(ix, iy + 0.16 * bounce); c.lineTo(ix, iy + 0.02); c.stroke(); c.restore();
      }
      if (isDrag && dragging !== piece) dragArrows(pos.x, pos.y, 0.85, now);
    } else if (piece.type === 'cart') {
      c.save(); c.translate(pos.x, pos.y); c.rotate(body.getAngle());
      if (isDrag) { c.save(); c.globalAlpha = dragging === piece ? 0.75 : 0.5; c.fillStyle = '#ffd040'; c.fillRect(-0.95, -0.75, 1.9, 1.2); c.restore(); }
      sprite(ART.mine_cart, 0, -0.12, 1.62, 1.215);
      c.restore();
      if (isDrag && dragging !== piece) dragArrows(pos.x, pos.y - 0.1, 1.15, now);
    } else if (piece.type === 'fan') {
      const ang = body.getAngle(), dirX = -Math.sin(ang), dirY = Math.cos(ang);
      if (piece.on) {
        // corrientes de viento: trazos claros que avanzan por la franja
        c.save(); c.translate(pos.x, pos.y); c.rotate(ang);
        c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineCap = 'round'; c.lineWidth = 0.06;
        for (let i = 0; i < 9; i++) {
          const k = ((now / 1000) * 1.1 + i * 0.37) % 1;
          const lx = (((i * 0.61) % 1) - 0.5) * piece.width * 0.85 + Math.sin(now / 300 + i) * 0.08;
          const ly = 0.9 + k * piece.range;
          c.globalAlpha = Math.sin(k * Math.PI) * 0.8;
          c.beginPath(); c.moveTo(lx, ly); c.lineTo(lx, ly + 0.55); c.stroke();
        }
        c.restore();
        piece.spin += 0.5;
      }
      const glowOn = (piece.drag || piece.rotate || piece.toggle) && L.state === 'prep';
      c.save(); c.translate(pos.x, pos.y); c.rotate(ang);
      if (glowOn) { c.save(); c.globalAlpha = (dragging === piece ? 0.75 : 0.5) + (piece.toggle ? 0.15 * Math.sin(now / 200) : 0); c.fillStyle = '#ffd040'; c.beginPath(); c.ellipse(0, 0.45, 1.0, 0.72, 0, 0, Math.PI * 2); c.fill(); c.restore(); }
      sprite(ART.fan_base, 0, 0.5, 1.5, 1.0);
      sprite(ART.fan_blades, 0, 0.62, 0.62, 0.62, piece.spin, piece.on ? 1 : 0.6);
      c.restore();
      if (piece.toggle && L.state === 'prep') {
        const bounce = performance.now() - (piece.flash || 0) < 200 ? 1.25 : 1;
        // icono al costado de la carcasa (a la derecha de los verticales, debajo de los que soplan a la derecha)
        const ix = pos.x + dirX * 0.4 + dirY * 1.05, iy = pos.y + dirY * 0.4 - dirX * 1.05;
        disc(ix, iy, 0.3 * bounce, '#26345c');
        disc(ix, iy, 0.24 * bounce, piece.on ? '#53d18a' : '#ff6b6b');
        c.save(); c.strokeStyle = '#fff'; c.lineWidth = 0.05; c.lineCap = 'round';
        c.beginPath(); c.arc(ix, iy, 0.12 * bounce, Math.PI / 2 + 0.6, Math.PI / 2 - 0.6 + Math.PI * 2); c.stroke();
        c.beginPath(); c.moveTo(ix, iy + 0.16 * bounce); c.lineTo(ix, iy + 0.02); c.stroke(); c.restore();
      }
      if (isDrag && dragging !== piece) dragArrows(pos.x, pos.y + 0.45, 1.05, now);
    } else if (piece.type === 'cloud') {
      if (piece.squash > 0) piece.squash = Math.max(0, piece.squash - 1 / 60);
      const sq = 0.18 * Math.sin((piece.squash / 0.2) * Math.PI);
      const w = d.w + 0.4, h = 0.95;
      if (isDrag) { c.save(); c.globalAlpha = dragging === piece ? 0.75 : 0.5; c.fillStyle = '#ffd040'; c.beginPath(); c.ellipse(pos.x, pos.y + 0.1, w / 2 + 0.15, 0.6, 0, 0, Math.PI * 2); c.fill(); c.restore(); }
      sprite(ART.cloud_pad, pos.x, pos.y + 0.12 - sq / 2, w * (1 + sq * 0.5), h * (1 - sq));
      if (isDrag && dragging !== piece) dragArrows(pos.x, pos.y + 0.1, w / 2 + 0.2, now);
    } else if (piece.type === 'balloon') {
      if (piece.popped) return;
      const bob = Math.sin(now / 600 + pos.x * 2) * 0.08, r = piece.r;
      if (isDrag) disc(pos.x, pos.y + bob, r + 0.15, dragging === piece ? '#fff3b0' : '#ffd040');
      sprite(ART['balloon_' + piece.color] || ART.balloon_red, pos.x, pos.y - r * 0.45 + bob, r * 2.1, r * 3.15, Math.sin(now / 700 + pos.y) * 0.06);
      if (isDrag && dragging !== piece) dragArrows(pos.x, pos.y + bob, r + 0.35, now);
    } else if (piece.type === 'crate') {
      if (isDrag) sliced(ART.crate || ART.block_wood, pos.x, pos.y, d.w + 0.22, d.h + 0.22, body.getAngle(), dragging === piece ? '#fff3b0' : '#ffd040');
      sliced(ready(ART.crate) ? ART.crate : ART.block_wood, pos.x, pos.y, d.w, d.h, body.getAngle());
      if (isDrag && dragging !== piece) dragArrows(pos.x, pos.y, d.w / 2 + 0.35, now);
    } else if (piece.type === 'pendulum') {
      const a = piece.anchor;
      if (piece.drag) sliced(ART.block_post, (piece.drag.xMin + piece.drag.xMax) / 2, a.y + 0.12, piece.drag.xMax - piece.drag.xMin + 1.2, 0.24);
      else sliced(ART.block_post, a.x, a.y + 0.12, 1.2, 0.24);
      c.save(); c.strokeStyle = '#7a5530'; c.lineWidth = 0.07; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(pos.x, pos.y); c.stroke(); c.restore();
      disc(a.x, a.y, 0.12, '#3d4a73');
      if (isDrag) disc(pos.x, pos.y, piece.r + 0.13, dragging === piece ? '#fff3b0' : '#ffd040');
      sprite(ART.iron_ball, pos.x, pos.y, piece.r * 2, piece.r * 2, body.getAngle());
      if (isDrag && dragging !== piece) dragArrows(a.x, a.y - 0.05, 0.45, now);
    } else if (piece.type === 'star') {
      if (piece.collected) return;
      const t = now / 1000 * 2.4 + pos.x;
      const s = 0.8 * (1 + Math.sin(t * 1.7) * 0.06);
      sprite(ART.star, pos.x, pos.y + Math.sin(t) * 0.06, s, s, Math.sin(t * 0.8) * 0.14);
    }
  }

  let last = 0;
  function frame(now) {
    if (L.state !== 'prep') {
      accumulator += Math.min(0.1, (now - (last || now)) / 1000);
      while (accumulator >= DT) { step(); accumulator -= DT; }
    }
    last = now;
    draw(now);
    requestAnimationFrame(frame);
  }

  // Ganchos de prueba: colocan piezas y simulan sin esperar al reloj.
  window.wobbleTest = {
    levels: LEVELS,
    finale() { showFinale(); },
    run(index, placements, trace) {
      sound.state.silent = true;
      setTimeout(() => { sound.state.silent = false; }, 0);
      loadLevel(index);
      for (const [id, pos] of Object.entries(placements || {})) placePiece(L.pieces.find((p) => p.id === id), pos);
      play();
      const path = [];
      let t = 0;
      for (; t < 12 && L.state === 'sim'; t += DT) {
        step();
        if (trace && Math.round(t / DT) % 10 === 0) { const p = L.bloop.getPosition(); path.push(`${t.toFixed(1)}:(${p.x.toFixed(2)},${p.y.toFixed(2)})`); }
      }
      const end = L.bloop.getPosition();
      const result = { state: L.state, stars: collectedStars(), end: `(${end.x.toFixed(2)},${end.y.toFixed(2)})`, t: t.toFixed(2), path: path.join(' ') };
      resetLevel();
      return result;
    },
    probe(index, placements, seconds, fn, stride = 10) {
      sound.state.silent = true;
      setTimeout(() => { sound.state.silent = false; }, 0);
      loadLevel(index);
      for (const [id, pos] of Object.entries(placements || {})) placePiece(L.pieces.find((p) => p.id === id), pos);
      play();
      const rows = [];
      for (let t = 0; t < seconds && L.state === 'sim'; t += DT) { step(); if (Math.round(t / DT) % stride === 0) rows.push(fn(L, t)); }
      resetLevel();
      return rows.join(' ');
    },
    solve(index) {
      const placements = Object.fromEntries(LEVELS[index].solution.map((s) => [s.id, { x: s.x, angle: s.angle, dir: s.dir }]));
      const r = this.run(index, placements);
      return `${r.state}:${r.stars}`;
    },
  };

  let start = 0;
  try { start = Math.min(LEVELS.length - 1, Math.max(0, Number(localStorage.getItem('wobble-last')) || 0)); } catch {}
  if (!unlocked(start)) start = 0;
  loadLevel(start);
  resize();
  requestAnimationFrame(frame);

  // Portada: la primera pantalla. El toque en «¡Jugar!» también enciende el audio (iPhone lo exige).
  const titleTexts = () => {
    $('title-tagline').textContent = t('title_tagline');
    $('title-play').textContent = t('title_play');
    $('title-lang').textContent = t('language');
    const tip = { es: 'Para guardar tu progreso, toca <b>Compartir</b> y luego <b>Agregar a pantalla de inicio</b>.',
      en: 'To keep your progress, tap <b>Share</b> and then <b>Add to Home Screen</b>.',
      pt: 'Para salvar seu progresso, toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.' };
    $('ios-tip-text').innerHTML = tip[lang] || tip.es;
    $('link-site').href = lang === 'es' ? '/wobble-rescue/' : `/${lang}/wobble-rescue/`;
  };
  titleTexts();
  $('title').hidden = false;
  $('stage').classList.add('titling');
  $('title-lang').addEventListener('click', () => { $('btn-lang').click(); titleTexts(); });
  $('btn-lang').addEventListener('click', titleTexts);
  $('title-play').addEventListener('click', () => {
    sound.start();
    $('title').hidden = true;
    $('stage').classList.remove('titling');
    loadLevel(L.index);   // vuelve a mostrar el cartel del nivel
  });
  if (/Android/i.test(navigator.userAgent)) $('link-play').hidden = false;

  const loader = $('vrf-loader');
  loader.style.opacity = '0';
  setTimeout(() => loader.remove(), 450);

  (function iosTip() {
    const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    if (!ios || standalone) return;
    const key = 'vrf_ios_tip_wobble', today = new Date().toDateString();
    try { if (localStorage.getItem(key) === today) return; } catch {}
    const tip = $('ios-tip');
    const hide = () => { tip.style.display = 'none'; try { localStorage.setItem(key, today); } catch {} };
    tip.querySelector('button').onclick = hide;
    setTimeout(() => { tip.style.display = 'flex'; setTimeout(hide, 12000); }, 3000);
  })();
})();
</script>

<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
