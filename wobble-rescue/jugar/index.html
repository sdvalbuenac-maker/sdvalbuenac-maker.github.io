<style>
  /* Pantalla de juego vertical a sangre: marco 9:16 centrado, HUD encima del canvas. Aspecto único (cielo de día). */
  :root {
    --sky: #8ccbf0;
    --frame-bg: #2a3557;
    --panel: rgba(22, 30, 62, 0.92);
    --go: #3fb54a;
    --go-dark: #2a8a33;
    --blue: #2f7ee0;
    --blue-dark: #1f5cad;
    --gold: #ffcf3a;

    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--frame-bg);
    color: #fff;
    font-family: var(--display);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .stage {
    position: relative;
    height: 100%;
    max-height: 920px;
    aspect-ratio: 9 / 16;
    max-width: 100%;
    border-radius: 22px;
    overflow: hidden;
    background: var(--sky);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  canvas.can-grab { cursor: grab; }
  canvas.grabbing { cursor: grabbing; }

  .hud-top {
    position: absolute; inset: 0 0 auto 0;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 14px 14px 0;
    pointer-events: none;
  }
  .pill {
    background: var(--panel);
    border-radius: 999px;
    padding: 4px 18px;
    font-weight: 700;
    font-size: clamp(15px, 2.4vh, 22px);
    display: flex; flex-direction: column; align-items: center; line-height: 1.15;
    min-width: 0;
  }
  .pill small { font-weight: 500; font-size: 0.62em; opacity: 0.85; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
  button {
    font-family: var(--display);
    font-weight: 800;
    color: #fff;
    border: 0;
    cursor: pointer;
    pointer-events: auto;
    transition: transform 0.08s ease;
  }
  button:active { transform: translateY(3px); }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .btn-round {
    width: clamp(44px, 6.4vh, 58px); height: clamp(44px, 6.4vh, 58px);
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 5px 0 var(--blue-dark);
    display: grid; place-items: center;
    flex: none;
  }
  .btn-round svg { width: 55%; height: 55%; }
  .hud-hint {
    position: absolute; inset: 0 0 auto 0; top: clamp(70px, 10vh, 96px);
    display: flex; justify-content: center; padding: 0 16px;
    pointer-events: none;
  }
  .hint {
    background: var(--panel);
    border-radius: 14px;
    padding: 6px 14px;
    font-weight: 500;
    font-size: clamp(13px, 2vh, 18px);
    text-align: center;
  }
  .hud-bottom {
    position: absolute; inset: auto 0 0 0;
    display: flex; justify-content: center;
    padding: 0 16px 22px;
    pointer-events: none;
  }
  .btn-go {
    background: var(--go);
    box-shadow: 0 7px 0 var(--go-dark);
    border-radius: 999px;
    font-size: clamp(22px, 3.6vh, 34px);
    padding: 6px 46px 4px;
  }
  .btn-alt {
    background: var(--blue);

    padding: 4px 24px 2px;
  }
  .overlay {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(20, 26, 50, 0.45);
  }
  .card {
    background: var(--panel);
    border-radius: 22px;
    padding: 22px 24px 24px;

  .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; margin: 8px 0 4px; }
  .lvl {
    aspect-ratio: 1; border-radius: 14px;

  @keyframes star-pop { to { transform: scale(1); } }
  .banner {
    position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%);

  @keyframes banner {
    0% { opacity: 0; transform: translate(-50%, -160%); }
    18% { opacity: 1; transform: translate(-50%, -50%); }
    78% { opacity: 1; transform: translate(-50%, -50%); }
    100% { opacity: 0; transform: translate(-50%, -260%); }
  }
  @keyframes pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .overlay.finale { background: transparent; place-items: end center; padding-bottom: 6vh; }

  html, body { overscroll-behavior: none; background: var(--frame-bg); }
  body { height: 100vh; height: 100dvh; padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom)); margin: 0;
    background: radial-gradient(1200px 700px at 50% 0%, #3b4c86 0%, #1c2442 65%) fixed, #1c2442; }
  button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

    .toast { bottom: calc(clamp(96px, 14vh, 130px) + env(safe-area-inset-bottom)); }
  }
  #vrf-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(circle at 50% 35%, #3b4c86 0%, #1c2442 70%); color: #fff; font-family: system-ui, sans-serif; z-index: 50; transition: opacity .4s; }
  #vrf-loader img { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 0 0 4px #ffcf3a, 0 18px 50px rgba(255,207,58,.25); animation: vrf-b 1.4s ease-in-out infinite; }

  @keyframes vrf-b { 50% { transform: translateY(-8px) scale(1.03); } }
  @keyframes vrf-l { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  .overlay.title { background: linear-gradient(180deg, rgba(20,26,50,.25), rgba(20,26,50,.65)); }
  .stage.titling .hud-top, .stage.titling .hud-hint, .stage.titling .hud-bottom, .stage.titling .btn-hint, .stage.titling .banner { visibility: hidden; }
  .title-card { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 0 22px; animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }

  .title-card h1 { margin: 0; font-size: clamp(44px, 8.4vh, 74px); line-height: .9; font-weight: 800; color: #fff;
    text-shadow: 0 5px 0 #1f5cad, 0 10px 24px rgba(0,0,0,.35); letter-spacing: .01em; }
  .title-card h1 b { display: block; color: var(--gold); text-shadow: 0 5px 0 #c9930f, 0 10px 24px rgba(0,0,0,.35); }
  .title-card p { margin: 4px 0 8px; font-weight: 600; font-size: clamp(15px, 2.3vh, 20px); background: var(--panel); border-radius: 14px; padding: 6px 14px; max-width: 340px; }

  .ad-screen .house { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .ad-screen .house img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 0 0 4px #ffcf3a, 0 18px 50px rgba(255,207,58,.25); }
  .ad-screen .btn-alt[disabled] { opacity: .55; }
  .ad-tag { top: calc(14px + env(safe-area-inset-top)) !important; }
  #ios-tip { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 60; display: none; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 16px; background: rgba(10,14,36,.94); color: #eef2ff; font: 14px/1.35 system-ui, sans-serif; box-shadow: 0 10px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(77,163,255,.35); }

  @media (prefers-reduced-motion: reduce) { .card { animation: none; } button { transition: none; } }
</style>

<script src="planck.min.js"></script>
<script>
(async () => {
  const pl = window.planck;
  const Vec2 = pl.Vec2;
  const DEG = Math.PI / 180;

  // ---- Reglas comunes (idénticas a SimulationController en Unity) ----
  const FLOOR_TOP = -8.5;
  const BOMB_TOUCH = 0.95, BOMB_CHAIN_STEPS = 6, STORM_TOUCH = 0.45;
  let shakeUntil = 0;
  const PORTAL_R = 0.6, PORTAL_EXIT = 0.85, PORTAL_MIN_SPEED = 3, PORTAL_COOLDOWN = 15;
  const KILL_Y = -12, KILL_X = 8, MAX_SIM = 10, STILL_GRACE = 3, STILL_FAIL = 1.5;
  const DT = 0.02;
  const CAMERA_Y = -1.6;
  const GRIPPY = 1;
  const COLORS = { stone: '#8a8c99', wood: '#b98146', ice: '#bfe8ff', grass: '#6fba55' };

  // Reintenta: algunos antivirus cortan conexiones locales de vez en cuando.
  const getJson = async (url) => {
    for (let i = 0; ; i++) {
      try { return await (await fetch(url, { cache: 'no-cache' })).json(); }
      catch (e) { if (i >= 4) throw e; await new Promise((r) => setTimeout(r, 300 * (i + 1))); }
    }
  };
  const LEVELS = (await getJson('levels.json')).levels;

  // ---- Idiomas: mismo strings.json que Unity. Primero el del navegador, luego el que elija el jugador. ----
  const LANGS = ['es', 'en', 'pt'];
  const STRINGS = Object.fromEntries((await getJson('strings.json')).entries.map((e) => [e.key, e]));
  const detectLang = () => {
    const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    for (const p of prefs) { const code = String(p).slice(0, 2).toLowerCase(); if (code === 'es' || code === 'pt') return code; if (code === 'en') return 'en'; }
    return 'en';
  };
  let lang;

  // ---- Sonido: los mismos WAV que usa Unity (Tools/generate_audio.py). Arranca con el primer toque. ----
  const sound = (() => {
    const names = ['sfx_spring', 'sfx_bounce', 'sfx_thud', 'sfx_click', 'sfx_pick', 'sfx_drop', 'sfx_whoosh', 'sfx_win', 'sfx_fail', 'sfx_star', 'sfx_pop', 'sfx_puff', 'sfx_clank', 'sfx_warp', 'sfx_boom', 'sfx_zap', 'music_pradera', 'music_taller', 'music_fabrica', 'music_cielo', 'music_mina', 'music_portal', 'music_volcan', 'music_castillo', 'music_fiesta'];
    const TRACKS = ['music_pradera', 'music_taller', 'music_fabrica', 'music_cielo', 'music_mina', 'music_portal', 'music_volcan', 'music_castillo'];
    let track = 'music_pradera';
    const read = (key) => { try { return localStorage.getItem(key) !== '0'; } catch { return true; } };
    const save = (key, on) => { try { localStorage.setItem(key, on ? '1' : '0'); } catch {} };
    let ctx = null, sfxGain, musicGain, musicNode = null;
    const buffers = {}, last = {};
    const state = { music: read('wobble-music'), sfx: read('wobble-sfx'), silent: false };

    // Duración real de cada pista (el MP3 puede traer relleno al final): el bucle no hace "clic".
    const LOOP = { music_castillo: 20, music_cielo: 20.869569, music_fabrica: 16, music_fiesta: 15, music_mina: 19.2, music_portal: 17.142857, music_pradera: 17.142857, music_taller: 18.461542, music_volcan: 16.271202 };
    const loading = {};
    function load(n) {
      if (buffers[n]) return Promise.resolve();
      if (loading[n]) return loading[n];
      return (loading[n] = (async () => {
        for (let attempt = 0; attempt < 3 && !buffers[n]; attempt++) {
          try {
            const data = await (await fetch(`audio/${n}.${n.startsWith('music') ? 'mp3' : 'wav'}`)).arrayBuffer();
            buffers[n] = await new Promise((ok, ko) => ctx.decodeAudioData(data, ok, ko));
          } catch {}
        }
        loading[n] = null;
      })());
    }
    let adPaused = false;
    async function start() {
      if (ctx) { if (ctx.state !== 'running' && !document.hidden && !adPaused) ctx.resume().catch(() => {}); return; }
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
      ctx = new Ctx();
      if (ctx.state !== 'running') ctx.resume().catch(() => {});
      sfxGain = ctx.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = 0.4; musicGain.connect(ctx.destination);
      // En segundo plano o durante un anuncio real, silencio total.
      document.addEventListener('visibilitychange', () => { if (document.hidden) ctx.suspend().catch(() => {}); else if (!adPaused) ctx.resume().catch(() => {}); });
      window.addEventListener('vrf-ad-start', () => { adPaused = true; ctx.suspend().catch(() => {}); });
      window.addEventListener('vrf-ad-end', () => { adPaused = false; ctx.resume().catch(() => {}); });
      applyMusic();
      await Promise.all(names.filter((n) => n.startsWith('sfx')).map(load));
    }
    function applyMusic() {
      if (!ctx) return;
      if (state.music && !musicNode) {
        if (!buffers[track]) { const want = track; load(want).then(() => { if (track === want) applyMusic(); }); return; }
        musicNode = ctx.createBufferSource();
        musicNode.buffer = buffers[track];
        musicNode.loop = true;
        if (LOOP[track] && LOOP[track] < musicNode.buffer.duration) musicNode.loopEnd = LOOP[track];
        musicNode.connect(musicGain);
        musicNode.start();
      } else if (!state.music && musicNode) {
        musicNode.stop(); musicNode = null;
      }
    }
    function play(name, volume = 1, rate = 1) {
      if (!ctx || !state.sfx || state.silent || !buffers[name]) return;
      const now = ctx.currentTime;
      if (now - (last[name] ?? -1) < 0.05) return;   // varios choques a la vez no deben zumbar
      last[name] = now;
      const src = ctx.createBufferSource();
      src.buffer = buffers[name];
      src.playbackRate.value = rate;
      const g = ctx.createGain(); g.gain.value = volume;
      src.connect(g).connect(sfxGain);
      src.start();
    }
    return {
      start, play, state,
      setMusic(on) { state.music = on; save('wobble-music', on); applyMusic(); },
      /// Cambia a la música del mundo (1 = Pradera, 2 = Taller) si no es la que ya suena.
      setWorld(n) {
        const next = n === 'fiesta' ? 'music_fiesta' : TRACKS[Math.min(TRACKS.length, Math.max(1, n)) - 1];
        if (next === track) return;
        track = next;
        if (musicNode) { musicNode.stop(); musicNode = null; }
        applyMusic();
      },
      setSfx(on) { state.sfx = on; save('wobble-sfx', on); },
    };
  })();
  for (const ev of ['pointerdown', 'touchend', 'click']) window.addEventListener(ev, () => sound.start(), { capture: true });

  const poses = {};
  for (const name of ['idle', 'anticipation', 'airborne', 'victory', 'fail']) {

  // ---- Progreso (solo en este navegador) ----

         ['llanero-icon.webp', 'Llanero Adventure', 'Run and jump across 15 places in Venezuela. Free at visualrocketflyers.com'],

         ['llanero-icon.webp', 'Llanero Adventure', 'Corra e pule por 15 destinos da Venezuela. Grátis em visualrocketflyers.com'],

  let houseTurn = 0;
  function houseAd(seconds) {
    return new Promise((resolve) => {
      const screen = $('ad'), close = $('ad-close'), H = HOUSE[lang] || HOUSE.es;
      const promo = H[houseTurn++ % 2];
      $('ad-img').src = `/img/juegos/${promo[0]}`;

  /// Muestra un anuncio (premio o entre niveles). Devuelve true si corresponde entregar el premio.

  // ---- Construcción del nivel desde datos ----
  let world, L;   // L = nivel cargado: cuerpos, piezas y estado
  const pending = [];

  function buildLevel(index) {
    const def = LEVELS[index];
    world = new pl.World({ gravity: Vec2(0, -9.81) });
    const ground = world.createBody();
    const box = (body, hx, hy, cx, cy, angle, opts) =>
      body.createFixture(pl.Box(hx, hy, Vec2(cx, cy), angle || 0), Object.assign({ friction: GRIPPY }, opts));
    box(ground, 7, 3, 0, FLOOR_TOP - 3);
    box(ground, 0.3, 15, -5.3, 0);
    box(ground, 0.3, 15, 5.3, 0);

    L = { index, def, pieces: [], resettables: [], draggables: [], springs: [], goals: [], balls: [], stars: [], extra: [], belts: [], toggles: [], fans: [], clouds: [], balloons: [], magnets: [], metals: [], portals: [], steps: 0, bombs: [], lavas: [], clock: 0, storms: [], bloop: null, fails: 0 };

    for (const p of def.pieces) {
      const piece = { def: p, type: p.type };
      if (p.type === 'block') {
        piece.body = world.createBody({ type: 'static', position: Vec2(p.x, p.y), angle: (p.angle || 0) * DEG });
        box(piece.body, p.w / 2, p.h / 2, 0, 0, 0, { friction: p.friction ?? GRIPPY });
        if (p.rotate || p.drag) L.resettables.push(piece.body);   // vuelve a su sitio al reiniciar
      } else if (p.type === 'seesaw') {
        const half = p.w / 2;
        piece.body = world.createBody({ type: 'dynamic', position: Vec2(p.x, p.y), angle: p.angle * DEG });
        box(piece.body, half, 0.15, 0, 0, 0, { density: 0.5 });
        piece.lipX = p.angle >= 0 ? -half + 0.1 : half - 0.1;   // tope en el extremo bajo
        box(piece.body, 0.1, 0.25, piece.lipX, 0.35, 0, { density: 0.5 });
        world.createJoint(pl.RevoluteJoint({ collideConnected: true }, ground, piece.body, Vec2(p.x, p.y)));
        L.resettables.push(piece.body);
      } else if (p.type === 'bloop') {
        piece.body = world.createBody({ type: 'dynamic', position: Vec2(p.x, p.y), fixedRotation: true, bullet: true });
        piece.body.createFixture(pl.Circle(0.5), { density: 1, friction: GRIPPY });
        L.bloop = piece.body;
        L.resettables.push(piece.body);
      } else if (p.type === 'ball') {
        piece.r = p.r ?? 0.45;
        piece.body = world.createBody({ type: 'dynamic', position: Vec2(p.x, p.y), bullet: true });
        piece.body.createFixture(pl.Circle(piece.r), { density: p.density ?? 6, friction: 0.4, restitution: 0.1 });
        L.resettables.push(piece.body);
        L.balls.push(piece.body);
        if (p.look === 'iron') L.metals.push(piece.body);
      } else if (p.type === 'spring') {
        piece.body = world.createBody({ type: 'static', position: Vec2(p.x, p.y), angle: (p.angle || 0) * DEG });
        box(piece.body, 0.6, 0.35, 0, 0.35, 0);
        piece.pad = piece.body.createFixture(pl.Box(0.6, 0.15, Vec2(0, 0.85), 0), { isSensor: true });
        piece.speed = p.speed ?? 15;
        piece.squash = 0;
        L.springs.push(piece);
        L.resettables.push(piece.body);
      } else if (p.type === 'goal') {
        piece.r = p.r ?? 0.9;
        piece.body = world.createBody({ position: Vec2(p.x, p.y) });
        piece.sensor = piece.body.createFixture(pl.Circle(piece.r), { isSensor: true });
        L.goals.push(piece);
      } else if (p.type === 'star') {
        piece.body = world.createBody({ position: Vec2(p.x, p.y) });
        piece.sensor = piece.body.createFixture(pl.Circle(0.38), { isSensor: true });
        piece.collected = false;
        L.stars.push(piece);
      } else if (p.type === 'crate') {
        // Caja de madera: cuerpo dinámico pesado (empuja, hace de contrapeso).
        piece.body = world.createBody({ type: 'dynamic', position: Vec2(p.x, p.y), angle: (p.angle || 0) * DEG });
        box(piece.body, p.w / 2, p.h / 2, 0, 0, 0, { density: p.density ?? 2, friction: 0.6 });
        L.resettables.push(piece.body);
        L.balls.push(piece.body);
      } else if (p.type === 'belt') {
        // Cinta transportadora: lo que va encima se lleva hacia `speed` (u/s, + a la derecha).
        piece.body = world.createBody({ type: 'static', position: Vec2(p.x, p.y) });
        piece.fixture = box(piece.body, p.w / 2, 0.15, 0, 0, 0, { friction: 0.8 });
        piece.speed = p.speed ?? 2.5;
        L.belts.push(piece);
        if (p.toggle) {
          piece.toggle = true;
          L.toggles.push(piece);
          L.extra.push({ save: () => piece.speed, load: (v) => { piece.speed = v; } });
        }
      } else if (p.type === 'fan') {
        // Ventilador: sopla a lo largo de su eje (local +y) en una franja de ancho `w` y largo `range`.
        piece.body = world.createBody({ type: 'static', position: Vec2(p.x, p.y), angle: (p.angle || 0) * DEG });
        box(piece.body, 0.7, 0.4, 0, 0.4, 0);
        piece.range = p.range ?? 5; piece.power = p.power ?? 18; piece.width = 1.4;
        piece.on = p.on ?? true;
        piece.spin = 0;
        L.fans.push(piece);
        L.resettables.push(piece.body);
        if (p.toggle) {
          piece.toggle = true;
          L.toggles.push(piece);
          L.extra.push({ save: () => (piece.on ? 1 : 0), load: (v) => { piece.on = !!v; } });
        }
      } else if (p.type === 'cloud') {
        // Nube saltarina: sólida; lo que cae encima rebota hacia arriba con `speed` (conserva la velocidad horizontal).
        piece.body = world.createBody({ type: 'static', position: Vec2(p.x, p.y) });
        box(piece.body, p.w / 2, 0.22, 0, 0, 0, { friction: 0 });
        piece.pad = piece.body.createFixture(pl.Box(p.w / 2 - 0.05, 0.1, Vec2(0, 0.3), 0), { isSensor: true });
        piece.speed = p.speed ?? 11;
        piece.squash = 0;
        L.clouds.push(piece);
        L.resettables.push(piece.body);
      } else if (p.type === 'balloon') {
        // Globo: Bloop lo revienta al tocarlo y sale impulsado hacia arriba (una sola vez por intento).
        piece.r = p.r ?? 0.55;
        piece.body = world.createBody({ type: 'static', position: Vec2(p.x, p.y) });
        piece.sensor = piece.body.createFixture(pl.Circle(piece.r), { isSensor: true });
        piece.speed = p.speed ?? 9;
        piece.popped = false;
        piece.color = p.color || ['red', 'yellow', 'teal', 'pink'][L.balloons.length % 4];
        L.balloons.push(piece);
        L.resettables.push(piece.body);
        L.extra.push({ save: () => 0, load: () => { piece.popped = false; } });
      } else if (p.type === 'magnet') {
        // Imán: atrae lo metálico (vagonetas y bolas de hierro) hacia sus polos, más fuerte cuanto más cerca.
        piece.body = world.createBody({ type: 'static', position: Vec2(p.x, p.y), angle: (p.angle || 0) * DEG });
        box(piece.body, 0.5, 0.45, 0, 0.05, 0);
        piece.range = p.range ?? 4.5; piece.power = p.power ?? 30;
        piece.on = p.on ?? true;
        L.magnets.push(piece);
        L.resettables.push(piece.body);
        if (p.toggle) {
          piece.toggle = true;
          L.toggles.push(piece);
          L.extra.push({ save: () => (piece.on ? 1 : 0), load: (v) => { piece.on = !!v; } });
        }
      } else if (p.type === 'cart') {
        // Vagoneta: tina metálica con ruedas sin fricción; Bloop puede viajar dentro.
        piece.body = world.createBody({ type: 'dynamic', position: Vec2(p.x, p.y), angle: (p.angle || 0) * DEG, angularDamping: 4 });
        const metal = { density: p.density ?? 5, friction: 0 };   // los costados resbalan contra las paredes
        box(piece.body, 0.64, 0.08, 0, -0.33, 0, { density: p.density ?? 5, friction: 0.5 });
        box(piece.body, 0.06, 0.3, -0.7, -0.05, 0, metal);
        box(piece.body, 0.06, 0.3, 0.7, -0.05, 0, metal);
        for (const wx of [-0.37, 0.37]) piece.body.createFixture(pl.Circle(Vec2(wx, -0.46), 0.19), { density: 1, friction: 0 });
        L.resettables.push(piece.body);
        L.balls.push(piece.body);
        L.metals.push(piece.body);
      } else if (p.type === 'portal') {
        // Portal: lo que entra por uno sale por su pareja (mismo `pair`), disparado por la boca (+y local).
        piece.body = world.createBody({ type: 'static', position: Vec2(p.x, p.y), angle: (p.angle || 0) * DEG });
        piece.body.createFixture(pl.Circle(PORTAL_R), { isSensor: true });
        piece.pair = p.pair ?? 1;
        piece.color = p.color || 'blue';
        piece.minSpeed = p.speed ?? PORTAL_MIN_SPEED;   // rapidez mínima de salida por este portal
        piece.on = p.on ?? true;   // cerrado: no transporta (ni de entrada ni de salida)
        L.portals.push(piece);
        if (p.toggle) {
          piece.toggle = true;
          L.toggles.push(piece);
          L.extra.push({ save: () => (piece.on ? 1 : 0), load: (v) => { piece.on = !!v; } });
        }
        L.resettables.push(piece.body);
      } else if (p.type === 'bomb') {
        // Bomba de confeti: estalla al cumplirse su mecha (`fuse` s desde ¡Probar!) o, si fuse = 0, al tocarla
        // algo que se mueve; empuja hacia fuera todo lo dinámico dentro de `radius`.
        piece.body = world.createBody({ type: 'static', position: Vec2(p.x, p.y) });
        piece.body.createFixture(pl.Circle(0.45), { isSensor: true });
        piece.fuse = p.fuse ?? 2; piece.radius = p.radius ?? 3; piece.power = p.power ?? 12;
        piece.on = p.on ?? true;
        piece.exploded = false;
        L.bombs.push(piece);
        L.resettables.push(piece.body);
        L.extra.push({ save: () => (piece.on ? 1 : 0), load: (v) => { piece.on = !!v; piece.exploded = false; piece.chainAt = 0; } });
        if (p.toggle) { piece.toggle = true; L.toggles.push(piece); }
      } else if (p.type === 'lava') {
        // Lava: sólida, y si Bloop la toca el intento termina.
        piece.body = world.createBody({ type: 'static', position: Vec2(p.x, p.y), angle: (p.angle || 0) * DEG });
        piece.fixture = box(piece.body, p.w / 2, p.h / 2, 0, 0, 0);
        L.lavas.push(piece);
      } else if (p.type === 'storm') {
        // Nube del Gruñubarrón: va y viene entre (x, y) y (x2, y2) con un periodo fijo; si toca a Bloop, se acabó.
        piece.from = Vec2(p.x, p.y); piece.to = Vec2(p.x2 ?? p.x, p.y2 ?? p.y);
        piece.period = p.period ?? 4; piece.r = p.r ?? 0.75;
        piece.pos = piece.from;
        L.storms.push(piece);
      } else if (p.type === 'pendulum') {
        // Péndulo: bola colgada de una cuerda rígida desde (x, y); `angle` en grados desde la vertical (+ a la derecha).
        piece.r = p.r ?? 0.45;
        piece.length = p.length;
        piece.anchor = Vec2(p.x, p.y);
        const a = (p.angle || 0) * DEG;
        piece.body = world.createBody({ type: 'dynamic', position: Vec2(p.x + Math.sin(a) * p.length, p.y - Math.cos(a) * p.length), bullet: true });
        piece.body.createFixture(pl.Circle(piece.r), { density: p.density ?? 6, friction: 0.4, restitution: 0.1 });
        piece.makeJoint = () => {
          if (piece.joint) world.destroyJoint(piece.joint);
          piece.joint = world.createJoint(pl.RevoluteJoint({}, ground, piece.body, piece.anchor));
        };
        piece.makeJoint();
        L.resettables.push(piece.body);
        L.balls.push(piece.body);
        L.extra.push({ save: () => piece.anchor.x, load: (x) => { piece.anchor = Vec2(x, piece.anchor.y); piece.makeJoint(); } });
        L.metals.push(piece.body);   // la bola del péndulo es de hierro
      }
      if (p.drag) {
        piece.drag = p.drag;
        L.draggables.push(piece);
      } else if (p.rotate) {
        piece.rotate = p.rotate;
        L.draggables.push(piece);
      }
      if (p.id) piece.id = p.id;
      L.pieces.push(piece);
    }

    world.on('begin-contact', (contact) => {
      const a = contact.getFixtureA(), b = contact.getFixtureB();
      for (const [sensor, other] of [[a, b], [b, a]]) {
        const spring = L.springs.find((s) => s.pad === sensor);
        if (spring && other.getBody().isDynamic()) pending.push(['spring', other.getBody(), spring]);
        if (L.goals.some((g) => g.sensor === sensor) && other.getBody() === L.bloop) pending.push(['goal']);
        const cloud = L.clouds.find((s) => s.pad === sensor);
        if (cloud && other.getBody().isDynamic()) pending.push(['cloud', other.getBody(), cloud]);
        const balloon = L.balloons.find((s) => s.sensor === sensor);
        if (balloon && other.getBody() === L.bloop) pending.push(['pop', null, balloon]);
        const star = L.stars.find((s) => s.sensor === sensor);
        if (star && other.getBody() === L.bloop) pending.push(['star', null, star]);
      }
      if (a.isSensor() || b.isSensor()) return;
      const ba = a.getBody(), bb = b.getBody();
      for (const lava of L.lavas) if ((lava.fixture === a && bb === L.bloop) || (lava.fixture === b && ba === L.bloop)) pending.push(['lava']);
      const speed = Vec2.distance(ba.getLinearVelocity(), bb.getLinearVelocity());
      if (speed < 1.5) return;
      for (const body of [ba, bb]) {
        if (body === L.bloop) pending.push(['impact', body, speed, 'sfx_bounce']);
        else if (L.metals.includes(body)) pending.push(['impact', body, speed, 'sfx_clank']);
        else if (L.balls.includes(body)) pending.push(['impact', body, speed, 'sfx_thud']);
      }
    });

    L.hint = revealedHints.has(def.id);   // pista ya pagada: gratis el resto de la sesión
    L.initial = snap();
    L.attemptSnap = L.initial;
    L.state = 'prep'; L.attempts = 0;
    pending.length = 0;
    finishedPose = null; launchUntil = 0;
  }

  const snap = () => {
    const s = L.resettables.map((b) => ({ p: b.getPosition().clone(), a: b.getAngle() }));
    s.extra = L.extra.map((e) => e.save());
    return s;
  };
  function restore(s) {
    L.resettables.forEach((b, i) => {
      b.setTransform(s[i].p, s[i].a);
      b.setLinearVelocity(Vec2(0, 0));
      b.setAngularVelocity(0);
      b.setAwake(true);
    });
    // Después de los cuerpos: la cuerda del péndulo se rehace con la bola ya en su sitio.
    L.extra.forEach((e, i) => e.load(s.extra[i]));
    pending.length = 0;
    finishedPose = null; launchUntil = 0;
    for (const s of L.springs) s.squash = 0;
    for (const s of L.stars) s.collected = false;
    L.clock = 0;   // las mechas vuelven a mostrar su tiempo completo
  }
  const collectedStars = () => L.stars.filter((s) => s.collected).length;

  // ---- Estado del puzzle ----
  let simTime = 0, stillTime = 0, accumulator = 0, launchUntil = 0, finishedPose = null;

  function setState(next) {
    if (next !== L.state) {
      if (next === 'sim') sound.play('sfx_whoosh', 0.8);
      else if (next === 'win') sound.play('sfx_win');
      else if (next === 'fail') sound.play('sfx_fail', 0.8);
    }
    const entering = next !== L.state;
    if (next === 'win' && L.state === 'sim') {
      adPolicy.wins++;
      const bp = L.bloop.getPosition();
      fx.burst('confetti', bp.x, bp.y + 1, 40);
    }
    if (next === 'fail' && L.state === 'sim') L.fails++;
    L.state = next;
    ui.play.hidden = next !== 'prep';
    $('btn-hint').hidden = !(next === 'prep' && L.def.solution && L.def.solution.length);
    // Saltar nivel: desde el segundo fallo en este nivel («Reiniciar» no borra la cuenta).
    $('btn-skip').hidden = !(next === 'fail' && L.fails >= 2 && L.index < LEVELS.length - 1 && canSkip(L.index));
    ui.hint.parentElement.hidden = !(next === 'prep' && L.attempts === 0);
    ui.result.hidden = !(next === 'win' || next === 'fail');
    if (next === 'win') {
      const stars = collectedStars();
      progress[L.def.id] = Math.max(progress[L.def.id] || 0, stars);
      done[L.def.id] = 1;
      saveProgress();
      const last = L.index === LEVELS.length - 1;
      ui.resultTitle.textContent = t(lastOfWorld(L.index) ? 'world_done' : 'rescued');
      if (entering) ui.stars.innerHTML = [0, 1, 2].map((i) => `<span class="star-pop" style="animation-delay:${0.25 + i * 0.28}s">${starSvg(i < stars)}</span>`).join('');
      ui.stars.hidden = false;
      ui.detail.textContent = t('stars_collected', stars, L.stars.length);
      ui.again.hidden = false;
      ui.resultBtn.textContent = t(last ? 'finale_go' : 'next');
    } else if (next === 'fail') {
      ui.resultTitle.textContent = t('oops');
      ui.stars.hidden = true;
      ui.detail.textContent = t('fail_detail');
      ui.again.hidden = true;
      ui.resultBtn.textContent = t('retry');
    }
  }

  function starSvg(on, size) {
    return `<svg viewBox="0 0 24 24"${size ? ` width="${size}" height="${size}"` : ''}><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" fill="${on ? '#ffcf3a' : '#4a5480'}" stroke="${on ? '#c9930f' : '#353d63'}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
  }

  function loadLevel(index) {
    buildLevel(index);
    try { localStorage.setItem('wobble-last', String(index)); } catch {}
    applyLanguage();
    // Cartel de entrada «Nivel N · nombre»: se reinicia la animación quitando y poniendo el elemento.
    const banner = $('banner');
    $('banner-title').textContent = t('level_title', localNumber(index));
    sound.setWorld(worldNum(LEVELS[index].id));
    $('banner-name').textContent = levelText(L.def, 'name');
    banner.hidden = true;
    void banner.offsetWidth;
    banner.hidden = false;
    clearTimeout(loadLevel.bannerTimer);
    loadLevel.bannerTimer = setTimeout(() => { banner.hidden = true; }, 1850);
  }

  /// Vuelve a escribir todos los textos visibles en el idioma actual.
  function applyLanguage() {
    document.documentElement.lang = lang;
    ui.title.textContent = t('level_title', localNumber(L.index));
    ui.name.textContent = levelText(L.def, 'name');
    ui.hint.textContent = levelText(L.def, 'hint') || '';
    ui.play.textContent = t('play');
    ui.again.textContent = t('again');
    ui.closePicker.textContent = t('back');

    $('btn-lang').textContent = t('language');
    $('badge').textContent = t('prototype');
    $('btn-skip').textContent = t('skip_level');
    $('btn-hint').setAttribute('aria-label', t('hint'));
    $('btn-hint').title = t('hint');
    ui.menu.setAttribute('aria-label', t('choose_level'));
    ui.reset.setAttribute('aria-label', t('reset'));
    ui.reset.title = t('reset');
    ui.menu.title = t('levels');
    if (typeof audioLabels === 'function') audioLabels();
    if (!ui.picker.hidden) openPicker(pickerWorld);
    setState(L.state);
  }

  function play() {
    if (L.state !== 'prep') return;
    L.attempts++;
    L.attemptSnap = snap();
    simTime = 0; stillTime = 0; accumulator = 0; L.clock = 0;
    setState('sim');
  }
  const retry = () => { restore(L.attemptSnap); setState('prep'); };
  const resetLevel = () => { L.attempts = 0; restore(L.initial); setState('prep'); };

  /// Cintas: después de cada paso, lo que está encima se acerca a la velocidad de la cinta.
  function driveBelts() {
    for (const belt of L.belts) {
      const top = belt.body.getPosition().y;
      // Lista de contactos actual (no eventos): vale también para lo que empieza encima de la cinta.
      for (let ce = belt.body.getContactList(); ce; ce = ce.next) {
        if (!ce.contact.isTouching()) continue;
        const b = ce.other;
        if (!b.isDynamic() || b.getPosition().y < top) continue;
        const v = b.getLinearVelocity();
        b.setLinearVelocity(Vec2(v.x + (belt.speed - v.x) * Math.min(1, DT * 10), v.y));
      }
    }
  }

  /// Ventiladores: empujan cada cuerpo dinámico dentro de su franja (más fuerte cerca de la boca) con algo de freno de aire.
  function driveFans() {
    for (const fan of L.fans) {
      if (!fan.on) continue;
      const a = fan.body.getAngle(), dir = Vec2(-Math.sin(a), Math.cos(a));
      for (let b = world.getBodyList(); b; b = b.getNext()) {
        if (!b.isDynamic()) continue;
        const lp = fan.body.getLocalPoint(b.getPosition());
        const along = lp.y - 0.8;
        if (along < 0 || along > fan.range || Math.abs(lp.x) > fan.width / 2) continue;
        const k = fan.power * (1 - 0.5 * along / fan.range);
        const v = b.getLinearVelocity(), m = b.getMass();
        b.applyForceToCenter(Vec2((dir.x * k - v.x * 0.8) * m, (dir.y * k - v.y * 0.8) * m), true);
      }
    }
  }

  /// Imanes: tiran de cada cuerpo metálico hacia sus polos (punto local (0, -0.55)) dentro de su alcance.
  function driveMagnets() {
    for (const mag of L.magnets) {
      if (!mag.on) continue;
      const pole = mag.body.getWorldPoint(Vec2(0, -0.55));
      for (const b of L.metals) {
        const d = Vec2.sub(pole, b.getPosition()), dist = d.length();
        if (dist > mag.range || dist < 0.05) continue;
        const k = mag.power * (1 - 0.6 * dist / mag.range) / dist, v = b.getLinearVelocity();
        const ax = d.x * k - v.x * 0.3, ay = d.y * k - v.y * 0.3;
        b.applyForceToCenter(Vec2(ax * b.getMass(), ay * b.getMass()), true);
        // Lo que va montado encima (Bloop en la vagoneta) recibe la misma aceleración: viajan juntos.
        for (let ce = b.getContactList(); ce; ce = ce.next) {
          const o = ce.other;
          if (!ce.contact.isTouching() || !o.isDynamic() || L.metals.includes(o) || o.getPosition().y < b.getPosition().y) continue;
          o.applyForceToCenter(Vec2(ax * o.getMass(), ay * o.getMass()), true);
        }
      }
    }
  }

  /// Portales: un cuerpo cuyo centro entra en un portal reaparece en su pareja, saliendo por la boca
  /// con la misma rapidez (mínimo PORTAL_MIN_SPEED). Una espera corta evita que rebote entre los dos.
  function drivePortals() {
    L.steps++;
    for (let b = world.getBodyList(); b; b = b.getNext()) {
      if (!b.isDynamic() || (b.portalReady || 0) > L.steps) continue;
      for (const from of L.portals) {
        if (!from.on || Vec2.distance(b.getPosition(), from.body.getPosition()) >= PORTAL_R) continue;
        const to = L.portals.find((q) => q !== from && q.pair === from.pair);
        if (!to || !to.on) continue;
        const a = to.body.getAngle(), n = Vec2(-Math.sin(a), Math.cos(a));
        const speed = Math.max(to.minSpeed, b.getLinearVelocity().length());
        const tp = to.body.getPosition();
        b.setTransform(Vec2(tp.x + n.x * PORTAL_EXIT, tp.y + n.y * PORTAL_EXIT), b.getAngle());
        b.setLinearVelocity(Vec2(n.x * speed, n.y * speed));
        b.portalReady = L.steps + PORTAL_COOLDOWN;
        pending.push(['warp', b, from, to]);
        break;
      }
    }
  }

  /// Bombas: cuenta la mecha en pasos (o espera un toque) y estalla una sola vez por intento.
  function driveBombs() {
    L.clock++;
    for (const bomb of L.bombs) {
      if (!bomb.on || bomb.exploded) continue;
      const bp = bomb.body.getPosition();
      let fire = (bomb.fuse > 0 && L.clock * DT >= bomb.fuse - 1e-6) || (bomb.chainAt && L.clock >= bomb.chainAt);
      if (bomb.fuse <= 0) {
        for (let b = world.getBodyList(); b && !fire; b = b.getNext()) if (b.isDynamic() && Vec2.distance(b.getPosition(), bp) < BOMB_TOUCH) fire = true;
      }
      if (!fire) continue;
      bomb.exploded = true;
      // Reacción en cadena: las bombas armadas dentro del radio estallan poco después.
      for (const other of L.bombs) {
        if (other !== bomb && other.on && !other.exploded && !other.chainAt && Vec2.distance(other.body.getPosition(), bp) < bomb.radius) other.chainAt = L.clock + BOMB_CHAIN_STEPS;
      }
      for (let b = world.getBodyList(); b; b = b.getNext()) {
        if (!b.isDynamic()) continue;
        const d = Vec2.sub(b.getPosition(), bp), dist = d.length();
        if (dist >= bomb.radius || dist < 1e-4) continue;
        const k = bomb.power * (1 - 0.5 * dist / bomb.radius) / dist, v = b.getLinearVelocity();
        b.setLinearVelocity(Vec2(v.x + d.x * k, v.y + d.y * k));
        b.setAwake(true);
      }
      pending.push(['boom', null, bomb]);
    }
  }

  /// Posición de una nube de tormenta en el instante t (s desde ¡Probar!): vaivén suave.
  const stormAt = (s, time) => {
    const k = 0.5 - 0.5 * Math.cos(2 * Math.PI * time / s.period);
    return Vec2(s.from.x + (s.to.x - s.from.x) * k, s.from.y + (s.to.y - s.from.y) * k);
  };
  function driveStorms() {
    for (const s of L.storms) {
      s.pos = stormAt(s, L.clock * DT);
      if (L.state === 'sim' && Vec2.distance(s.pos, L.bloop.getPosition()) < s.r + STORM_TOUCH) pending.push(['zap', null, s]);
    }
  }

  function step() {
    world.step(DT, 8, 3);
    drivePortals();
    driveBombs();
    driveStorms();
    driveBelts();
    driveFans();
    driveMagnets();
    for (const [kind, body, spring, sfx] of pending.splice(0)) {
      if (kind === 'impact') {
        sound.play(sfx, Math.min(1, spring / 9), 0.92 + Math.random() * 0.16);
        if (spring > 3) { const bp = body.getPosition(); fx.burst('dust', bp.x, bp.y - (body === L.bloop ? 0.45 : 0.3), 3 + Math.round(Math.min(1, spring / 9) * 5)); }
      } else if (kind === 'star') {
        if (L.state === 'sim' && !spring.collected) {
          spring.collected = true;
          sound.play('sfx_star');
          const sp = spring.body.getPosition();
          fx.burst('spark', sp.x, sp.y, 10, '#ffd23f');
        }
      } else if (kind === 'spring') {
        sound.play('sfx_spring');
        { const sp = spring.body.getWorldPoint(Vec2(0, 0.9)); fx.burst('spark', sp.x, sp.y, 6, '#fff3a0'); }
        const a = spring.body.getAngle();
        body.setLinearVelocity(Vec2(-Math.sin(a) * spring.speed, Math.cos(a) * spring.speed));
        spring.squash = 0.15;
        if (body === L.bloop) launchUntil = performance.now() + 120;
      } else if (kind === 'boom') {
        sound.play('sfx_boom');
        const bp = spring.body.getPosition();
        fx.burst('confetti', bp.x, bp.y, 60);
        fx.burst('spark', bp.x, bp.y, 16, '#ffd23f');
        shakeUntil = performance.now() + 250;
      } else if (kind === 'zap' && L.state === 'sim') {
        sound.play('sfx_zap');
        const p = L.bloop.getPosition();
        fx.burst('spark', p.x, p.y, 16, '#ffe35a');
        shakeUntil = performance.now() + 200;
        return fail();
      } else if (kind === 'lava' && L.state === 'sim') {
        const p = L.bloop.getPosition();
        fx.burst('spark', p.x, p.y - 0.4, 14, '#ff8c42');
        return fail();
      } else if (kind === 'warp') {
        sound.play('sfx_warp', 0.8);
        const fp = spring.body.getPosition(), tp = sfx.body.getPosition();
        fx.burst('spark', fp.x, fp.y, 8, spring.color === 'orange' ? '#ffb060' : '#7fd0ff');
        fx.burst('spark', tp.x, tp.y, 10, sfx.color === 'orange' ? '#ffb060' : '#7fd0ff');
        if (body === L.bloop) launchUntil = performance.now() + 120;
      } else if (kind === 'cloud') {
        const v = body.getLinearVelocity();
        if (v.y > 0.5) continue;   // solo rebota lo que cae
        body.setLinearVelocity(Vec2(v.x, spring.speed));
        sound.play('sfx_puff');
        spring.squash = 0.2;
        if (body === L.bloop) launchUntil = performance.now() + 120;
      } else if (kind === 'pop') {
        if (spring.popped || L.state !== 'sim') continue;
        spring.popped = true;
        const v = L.bloop.getLinearVelocity();
        L.bloop.setLinearVelocity(Vec2(v.x, spring.speed));
        sound.play('sfx_pop');
        const bp = spring.body.getPosition();
        fx.burst('confetti', bp.x, bp.y, 14);
        fx.burst('spark', bp.x, bp.y, 8, '#ffffff');
      } else if (kind === 'goal' && L.state === 'sim') {
        finishedPose = 'victory';
        setState('win');
      }
    }
    if (L.state !== 'sim') return;
    simTime += DT;
    const p = L.bloop.getPosition();
    if (p.y < KILL_Y || Math.abs(p.x) > KILL_X || simTime > MAX_SIM) return fail();
    if (simTime > STILL_GRACE && L.bloop.getLinearVelocity().lengthSquared() < 0.01) {
      stillTime += DT;
      if (stillTime > STILL_FAIL) fail();
    } else stillTime = 0;
  }
  function fail() { finishedPose = 'fail'; setState('fail'); }

  // ---- Entrada: arrastrar piezas ----
  let view = { scale: 1, half: 10 };
  let dragging = null, grabDx = 0, grabX = 0, grabAngle = 0;
  const ROTATE_DEG_PER_UNIT = 25;   // arrastrar a la derecha gira en sentido horario
  const toWorld = (ev) => {
    const r = canvas.getBoundingClientRect();
    const sx = (ev.clientX - r.left) * (canvas.width / r.width);
    const sy = (ev.clientY - r.top) * (canvas.height / r.height);
    return Vec2((sx - canvas.width / 2) / view.scale, (canvas.height / 2 - sy) / view.scale + CAMERA_Y);
  };
  const hitPiece = (w) => L.draggables.find((d) => {
    const p = d.body.getPosition();
    if (d.type === 'spring') return Math.abs(w.x - p.x) < 1.1 && w.y > p.y - 0.4 && w.y < p.y + 1.6;
    if (d.type === 'block') {
      const l = d.body.getLocalPoint(w);
      return Math.abs(l.x) < d.def.w / 2 + 0.3 && Math.abs(l.y) < d.def.h / 2 + 0.6;
    }
    if (d.type === 'magnet') return Vec2.distance(w, p) < 1.0;
    if (d.type === 'portal') return Vec2.distance(w, p) < 1.0;
    if (d.type === 'bomb') return Vec2.distance(w, p) < 0.9;
    if (d.type === 'cart') { const l = d.body.getLocalPoint(w); return Math.abs(l.x) < 1.0 && Math.abs(l.y + 0.1) < 0.8; }
    if (d.type === 'fan') { const l = d.body.getLocalPoint(w); return Math.abs(l.x) < 1 && l.y > -0.4 && l.y < 1.4; }
    if (d.type === 'cloud') return Math.abs(w.x - p.x) < d.def.w / 2 + 0.3 && Math.abs(w.y - p.y) < 0.7;
    if (d.type === 'pendulum') return Vec2.distance(w, p) < d.r + 0.6 || Vec2.distance(w, d.anchor) < 0.7;
    if (d.type === 'crate') {
      const l = d.body.getLocalPoint(w);
      return Math.abs(l.x) < d.def.w / 2 + 0.4 && Math.abs(l.y) < d.def.h / 2 + 0.4;
    }
    return Vec2.distance(w, p) < (d.r || 0.5) + 0.6;
  });
  /// Arrastre horizontal dentro del riel. El péndulo mueve su anclaje y la bola a la vez.
  const movePiece = (piece, x) => {
    const d = piece.drag;
    const nx = Math.min(d.xMax, Math.max(d.xMin, x));
    if (piece.type === 'pendulum') {
      const dx = nx - piece.anchor.x;
      const bp = piece.body.getPosition();
      piece.body.setTransform(Vec2(bp.x + dx, bp.y), piece.body.getAngle());
      piece.anchor = Vec2(nx, piece.anchor.y);
      piece.makeJoint();
      return;
    }
    const pos = piece.body.getPosition();
    piece.body.setTransform(Vec2(nx, pos.y), piece.body.getAngle());
  };
  /// Giro dentro de los límites (grados absolutos, antihorario positivo).
  const rotatePiece = (piece, deg) => {
    const r = piece.rotate;
    const a = Math.min(r.max, Math.max(r.min, deg));
    piece.body.setTransform(piece.body.getPosition(), a * DEG);
  };
  const placePiece = (piece, place) => {
    if (place.dir !== undefined && piece.toggle && (piece.type === 'fan' || piece.type === 'magnet' || piece.type === 'portal' || piece.type === 'bomb')) piece.on = place.dir > 0;
    else if (place.dir !== undefined && piece.toggle) piece.speed = Math.abs(piece.speed) * Math.sign(place.dir);
    else if (place.angle !== undefined && piece.rotate) rotatePiece(piece, place.angle);
    else if (place.x !== undefined && piece.drag) movePiece(piece, place.x);
  };
  canvas.addEventListener('pointerdown', (ev) => {
    if (L.state !== 'prep') return;
    const w = toWorld(ev);
    // Cintas con interruptor: tocar invierte el sentido (no se arrastran).
    const toggle = L.toggles.find((g) => {
      const p = g.body.getPosition();
      if (g.type === 'fan') { const l = g.body.getLocalPoint(w); return Math.abs(l.x) < 0.95 && l.y > -0.3 && l.y < 1.3; }
      if (g.type === 'magnet' || g.type === 'portal' || g.type === 'bomb') return Vec2.distance(w, p) < 0.95;
      return Math.abs(w.x - p.x) < g.def.w / 2 + 0.2 && Math.abs(w.y - p.y) < 0.9;
    });
    if (toggle) {
      if (toggle.type === 'fan' || toggle.type === 'magnet' || toggle.type === 'portal' || toggle.type === 'bomb') toggle.on = !toggle.on; else toggle.speed = -toggle.speed;
      sound.play('sfx_pick'); toggle.flash = performance.now(); return;
    }
    const piece = hitPiece(w);
    if (!piece) return;
    dragging = piece;
    grabDx = (piece.type === 'pendulum' ? piece.anchor.x : piece.body.getPosition().x) - w.x;
    grabX = w.x; grabAngle = piece.body.getAngle() / DEG;
    sound.play('sfx_pick');
    canvas.setPointerCapture(ev.pointerId);
    canvas.classList.add('grabbing');
  });
  canvas.addEventListener('pointermove', (ev) => {
    const w = toWorld(ev);
    if (dragging && dragging.rotate) rotatePiece(dragging, grabAngle - (w.x - grabX) * ROTATE_DEG_PER_UNIT);
    else if (dragging) movePiece(dragging, w.x + grabDx);
    canvas.classList.toggle('can-grab', L.state === 'prep' && !!hitPiece(w));
  });
  const endDrag = () => {
    if (dragging) sound.play('sfx_drop');
    dragging = null; canvas.classList.remove('grabbing');
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  function openPicker(world) {
    const worlds = Math.max(...LEVELS.map((l) => worldNum(l.id)));
    pickerWorld = Math.min(worlds, Math.max(1, world || pickerWorld));
    $('picker-title').textContent = t(`world_${pickerWorld}`);
    $('picker-sub').textContent = t(`world_${pickerWorld}_sub`);
    $('picker-prev').disabled = pickerWorld === 1;
    $('picker-next').disabled = pickerWorld === worlds;
    ui.grid.innerHTML = LEVELS.map((lvl, i) => {
      if (worldNum(lvl.id) !== pickerWorld) return '';
      const stars = progress[lvl.id] || 0;
      const open = unlocked(i);
      const n = localNumber(i);
      return `<button class="lvl" data-i="${i}" ${open ? '' : 'disabled'} aria-label="${t('level_title', n)}${open ? '' : ` (${t('locked')})`}">${n}<span class="mini">${[0, 1, 2].map((s) => starSvg(s < stars)).join('')}</span></button>`;
    }).join('');
    ui.picker.hidden = false;
  }
  $('picker-prev').addEventListener('click', () => openPicker(pickerWorld - 1));
  $('picker-next').addEventListener('click', () => openPicker(pickerWorld + 1));
  ui.grid.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.lvl');
    if (!btn || btn.disabled) return;
    ui.picker.hidden = true;
    loadLevel(Number(btn.dataset.i));
